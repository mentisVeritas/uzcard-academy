[project]
name = "uzcard-academy"
version = "0.1.0"
description = "Uzcard Academy — внутренняя программа обучения data science"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.3.0",
    "joblib>=1.4.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.10.0",
    "numpy>=2.4.6",
    "optuna>=4.9.0",
    "pandas>=3.0.3",
    "pandas-stubs~=3.0.3",
    "psycopg2-binary>=2.9.12",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.51",
]
