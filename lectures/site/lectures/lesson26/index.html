<script>
const slides=[...document.querySelectorAll('.slide')];
let cur=0;
const totEl=document.getElementById('tot'); if(totEl)totEl.textContent=slides.length;
function runCounters(s){s.querySelectorAll('[data-cnt]').forEach(el=>{
  const target=parseFloat(el.dataset.cnt),dec=parseInt(el.dataset.dec||'0'),pre=el.dataset.pre||'',suf=el.dataset.suf||'';
  const t0=performance.now();
  (function tick(t){const p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);el.textContent=pre+(target*e).toFixed(dec)+suf;if(p<1)requestAnimationFrame(tick);})(performance.now());
});}
function go(n){slides[cur].classList.remove('active');cur=(n+slides.length)%slides.length;slides[cur].classList.add('active');
  const sc=slides[cur].querySelector('.sc');if(sc){sc.style.animation='none';void sc.offsetWidth;sc.style.animation='';}
  slides[cur].querySelectorAll('.rise,.cl,.growx,.pill,.resbadge,.bn,.card').forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation='';});
  runCounters(slides[cur]);
  const c=document.getElementById('cur');if(c)c.textContent=cur+1;
  const p=document.getElementById('prog');if(p)p.style.width=((cur+1)/slides.length*100)+'%';}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}});
let tx=0;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1));},{passive:true});
go(0);
</script>

<script>

let cur=0;
const totEl=document.getElementById('tot'); if(totEl)totEl.textContent=slides.length;
function runCounters(s){s.querySelectorAll('[data-cnt]').forEach(el=>{
  const target=parseFloat(el.dataset.cnt),dec=parseInt(el.dataset.dec||'0'),pre=el.dataset.pre||'',suf=el.dataset.suf||'';
  const t0=performance.now();
  (function tick(t){const p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);el.textContent=pre+(target*e).toFixed(dec)+suf;if(p<1)requestAnimationFrame(tick);})(performance.now());
});}
function go(n){slides[cur].classList.remove('active');cur=(n+slides.length)%slides.length;slides[cur].classList.add('active');
  const sc=slides[cur].querySelector('.sc');if(sc){sc.style.animation='none';void sc.offsetWidth;sc.style.animation='';}
  slides[cur].querySelectorAll('.rise,.cl,.growx,.pill,.resbadge,.bn,.card').forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation='';});
  runCounters(slides[cur]);
  const c=document.getElementById('cur');if(c)c.textContent=cur+1;
  const p=document.getElementById('prog');if(p)p.style.width=((cur+1)/slides.length*100)+'%';}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}});
let tx=0;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1));},{passive:true});
go(0);
</script>

.cutline{animation:blink 1.8s ease-in-out infinite;}

/* big numbers */

.bn.good{border-color:#b8dfc1;background:#f4fbf6;}.bn.good .v{color:#1a9d4a;}
.bn.bad{border-color:#f0c8c8;background:#fef7f6;}.bn.bad .v{color:#e02d20;}
.bn.gray .v{color:#4a4d53;}
.arrow-big{font-size:clamp(24px,3vw,40px);color:#c3c7cf;font-weight:300;}

/* formula box */

.pstep .d{font-size:clamp(10px,1vw,12.5px);color:#6b6f76;margin-top:3px;font-weight:600;}

.legend span:before{content:'●';margin-right:5px;}

  const target=parseFloat(el.dataset.cnt),dec=parseInt(el.dataset.dec||'0'),pre=el.dataset.pre||'',suf=el.dataset.suf||'';
  const t0=performance.now();
  (function tick(t){const p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);el.textContent=pre+(target*e).toFixed(dec)+suf;if(p<1)requestAnimationFrame(tick);})(performance.now());
});}
function go(n){slides[cur].classList.remove('active');cur=(n+slides.length)%slides.length;slides[cur].classList.add('active');
  const sc=slides[cur].querySelector('.sc');if(sc){sc.style.animation='none';void sc.offsetWidth;sc.style.animation='';}
  slides[cur].querySelectorAll('.rise,.cl,.growx,.pill,.resbadge,.bn,.card').forEach(el=>{el.style.animation='none';void el.offsetWidth;el.style.animation='';});
  runCounters(slides[cur]);
  const c=document.getElementById('cur');if(c)c.textContent=cur+1;
  const p=document.getElementById('prog');if(p)p.style.width=((cur+1)/slides.length*100)+'%';}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}});
let tx=0;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1));},{passive:true});
go(0);
</script>
</body>
</html>
"></iframe>
<script>
function activeFrame(){return document.querySelector('iframe[data-lang="'+document.body.dataset.lang+'"]');}
function setLang(l){
  document.body.dataset.lang=l;
  document.querySelectorAll('.langsw button').forEach(b=>b.classList.toggle('on',b.dataset.l===l));
  var HL={ru:'← Главная',uz:'← Bosh sahifa',en:'← Home'},hl=document.getElementById('homeLabel');
  if(hl)hl.textContent=HL[l]||HL.ru;
  updateNav();
  var f=activeFrame(); if(f){ try{f.contentWindow.focus();}catch(e){} }
}
var PREV=null,NEXT=null,NAVT={ru:['Предыдущая','Следующая'],uz:['Oldingi','Keyingi'],en:['Previous','Next']};
function updateNav(){
  var l=document.body.dataset.lang||'ru',suf=(l!=='ru')?'#lang='+l:'',t=NAVT[l]||NAVT.ru;
  var pb=document.getElementById('prevBtn'),nb=document.getElementById('nextBtn');
  if(pb){pb.title=t[0];if(PREV){pb.href='../'+PREV+'/'+suf;pb.style.display='';}else{pb.style.display='none';}}
  if(nb){nb.title=t[1];if(NEXT){nb.href='../'+NEXT+'/'+suf;nb.style.display='';}else{nb.style.display='none';}}
}
(function(){
  var p=location.pathname.replace(/\/index\.html$/,'').replace(/\/$/,''),slug=p.split('/').pop();
  fetch('../../published.json').then(function(r){return r.json();}).then(function(list){
    var pub=list.filter(function(x){return x.langs&&x.langs.length;}).sort(function(a,b){return a.n-b.n;});
    var i=-1;for(var k=0;k<pub.length;k++){if(pub[k].slug===slug){i=k;break;}}
    if(i<0)return;
    PREV=i>0?pub[i-1].slug:null;NEXT=i<pub.length-1?pub[i+1].slug:null;updateNav();
  }).catch(function(){});
})();
document.querySelectorAll('.langsw button').forEach(b=>b.addEventListener('click',()=>{setLang(b.dataset.l);try{history.replaceState(null,'','#lang='+b.dataset.l);}catch(e){}}));
function initLang(){var m=/lang=(ru|uz|en)/.exec(location.hash||'');setLang(m?m[1]:'ru');}
window.addEventListener('hashchange',initLang);
// forward navigation keys to the visible deck regardless of focus
document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight',' '].includes(e.key)){
    var f=activeFrame();
    if(f&&f.contentDocument){
      try{f.contentDocument.dispatchEvent(new KeyboardEvent('keydown',{key:e.key,bubbles:true}));e.preventDefault();}catch(_){}
    }
  }
});
window.addEventListener('load',initLang);
</script>
