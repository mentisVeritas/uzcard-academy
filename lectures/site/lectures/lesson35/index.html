<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кредитный скоринг: от фразы бизнеса до постановки задачи</title>
<style>
:root{
  --ink:#17211b;--muted:#617067;--paper:#f7f8f4;--white:#fff;
  --green:#168447;--green2:#dff3e6;--lime:#b9e769;
  --red:#d94a3d;--red2:#fde8e5;--amber:#d88917;--amber2:#fff0d5;
  --blue:#1f68c1;--blue2:#e7f0fb;--purple:#7157b7;--purple2:#eee9fb;
  --line:#dfe5df;--shadow:0 20px 60px -42px rgba(25,43,32,.48);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%}
body{
  overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:Inter,Arial,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;
}
.deck{position:relative;width:100vw;height:100vh}
.slide{
  display:none;position:absolute;inset:0;align-items:center;justify-content:center;
  padding:clamp(38px,5vh,68px) clamp(46px,6vw,96px);
  background:
    radial-gradient(circle at 88% 12%,rgba(185,231,105,.18),transparent 24%),
    linear-gradient(135deg,#fafbf8 0%,#f4f7f2 100%);
}
.slide.active{display:flex}
.canvas{
  width:100%;max-width:1280px;margin:auto;display:flex;flex-direction:column;
  align-items:flex-start;justify-content:center;gap:clamp(14px,2vh,24px);
  animation:slideIn .42s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes slideIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.center .canvas{align-items:center;text-align:center}
.cover .canvas{max-width:1280px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(290px,.65fr);grid-template-rows:auto auto;align-items:center;justify-content:center;gap:clamp(18px,3vh,32px) clamp(38px,5vw,76px);text-align:left}
.cover h1{grid-column:1;grid-row:1;align-self:end;max-width:780px;font-size:clamp(56px,min(7.2vw,9vh),92px);line-height:.95}
.cover-subtitle{grid-column:1;grid-row:2;align-self:start;max-width:720px;color:#425047;font-size:clamp(22px,min(2.5vw,3.6vh),34px);line-height:1.3;font-weight:650}
.cover-image{grid-column:2;grid-row:1/3;width:100%;max-width:390px;aspect-ratio:1;justify-self:end;object-fit:cover;border:1px solid #cbd4cc;box-shadow:0 24px 70px -40px rgba(23,33,27,.65)}
.section-break .canvas{max-width:1180px;align-items:flex-start;justify-content:center}
.section-break h2{max-width:1100px;font-size:clamp(48px,6.4vw,92px);line-height:.98;letter-spacing:-.055em}
.section-answer{max-width:1000px;margin-top:14px;color:var(--green);font-size:clamp(25px,2.8vw,42px);line-height:1.22;font-weight:850;letter-spacing:-.035em}
.stage-row{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(260px,.65fr);gap:clamp(30px,4vw,64px);align-items:end;width:100%;margin-top:10px}
.stage-row.single{grid-template-columns:1fr}
.stage-row .section-answer{margin-top:0}
.stage-signal{display:flex;align-items:baseline;justify-content:flex-end;gap:clamp(8px,1vw,14px);padding:0 0 12px;border-bottom:5px solid var(--green);white-space:nowrap;color:var(--ink);font-size:clamp(23px,2.4vw,36px);font-weight:950;letter-spacing:-.045em}
.stage-signal i{font-style:normal;color:#a5afa8;font-weight:600}
.eyebrow{
  color:var(--green);font-size:clamp(11px,.9vw,14px);font-weight:900;
  letter-spacing:.17em;text-transform:uppercase;
}
h1{
  max-width:1120px;font-size:clamp(48px,6vw,84px);line-height:.96;
  letter-spacing:-.055em;font-weight:950;
}
h2{
  max-width:1180px;font-size:clamp(30px,3.6vw,52px);line-height:1.06;
  letter-spacing:-.045em;font-weight:950;
}
h3{font-size:clamp(18px,1.65vw,25px);line-height:1.15;font-weight:900}
p,.body{font-size:clamp(17px,1.55vw,23px);line-height:1.45}
.lead{max-width:1080px;color:#35443a;font-size:clamp(20px,2.05vw,30px);line-height:1.34;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:clamp(13px,1.05vw,16px);line-height:1.45;color:var(--muted)}
.mono{font-family:Consolas,"Courier New",monospace}
.green{color:var(--green)}.red{color:var(--red)}.amber{color:var(--amber)}.blue{color:var(--blue)}
.grid2,.grid3,.grid4{display:grid;width:100%;gap:clamp(14px,1.5vw,22px)}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{
  position:relative;background:transparent;border:0;border-left:4px solid var(--line);
  border-radius:0;padding:clamp(8px,1vw,14px) clamp(16px,1.5vw,24px);box-shadow:none;
}
.card h3{margin-bottom:10px}.card p,.card li{font-size:clamp(15px,1.22vw,18px);line-height:1.48;color:#48564d}
.card ul{padding-left:20px}.card li+li{margin-top:7px}
.card.g{border-left-color:var(--green)}.card.r{border-left-color:var(--red)}
.card.a{border-left-color:var(--amber)}.card.b{border-left-color:var(--blue)}
.card.p{border-left-color:var(--purple)}
.number{
  display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;
  background:var(--ink);color:#fff;font-size:14px;font-weight:900;margin-bottom:12px;
}
.quote{
  position:relative;max-width:1120px;padding:clamp(20px,2.4vw,36px) clamp(26px,3vw,44px);
  border-radius:0;background:transparent;color:var(--ink);box-shadow:none;border-left:8px solid var(--green);
  font-size:clamp(30px,3.7vw,54px);line-height:1.15;font-weight:900;letter-spacing:-.035em;
}
.quote small{display:block;margin-top:18px;color:var(--muted);font-size:clamp(15px,1.25vw,19px);font-weight:650;letter-spacing:0}
.flow{display:flex;width:100%;align-items:stretch;justify-content:center;gap:10px}
.node{
  flex:1;min-width:0;min-height:104px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:14px;border-radius:0;background:transparent;
  border:0;border-bottom:3px solid var(--line);box-shadow:none;
}
.node b{font-size:clamp(16px,1.4vw,21px)}.node span{margin-top:5px;color:var(--muted);font-size:clamp(12px,1vw,15px);line-height:1.35}
.arrow{align-self:center;color:#9aa69e;font-size:30px;font-weight:300}
.node.g{border-color:var(--green)}.node.r{border-color:var(--red)}
.node.a{border-color:var(--amber)}.node.b{border-color:var(--blue)}
.chain{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,1.6vw,22px) clamp(20px,3vw,44px)}
.chain-step{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:baseline;padding-bottom:clamp(8px,1.2vh,14px);border-bottom:1px solid #cbd4cc}
.chain-step i{font-style:normal;color:var(--green);font-size:clamp(24px,2.4vw,34px);font-weight:950;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.chain-step b{display:block;font-size:clamp(17px,1.5vw,22px);letter-spacing:-.02em}
.chain-step span{display:block;margin-top:4px;color:var(--muted);font-size:clamp(13px,1.05vw,16px);line-height:1.35}
.chain-note{width:100%;font-size:clamp(19px,1.85vw,27px);line-height:1.35;font-weight:800}
.chain-mini{display:flex;flex-wrap:wrap;align-items:center;gap:6px 9px;width:100%;margin-top:clamp(22px,4vh,44px);padding-top:16px;border-top:1px solid #cbd4cc;font-size:clamp(12px,1vw,15px);font-weight:750}
.chain-mini span{color:#8b968e}.chain-mini b{color:var(--green);font-weight:950}
.chain-mini i{font-style:normal;color:#c3cbc5}
.formula{
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:14px;width:100%;
  font-size:clamp(29px,4vw,57px);font-weight:950;letter-spacing:-.045em;
}
.formula span{padding:10px 0;border-radius:0;background:transparent;border:0;border-bottom:3px solid var(--ink)}
.formula .op{padding:0;background:none;border:0;color:#a2aca5;font-weight:500}
.funnel{width:100%;display:flex;flex-direction:column;align-items:center;gap:9px}
.metrics{display:flex;width:100%;gap:16px;justify-content:center;align-items:stretch;flex-wrap:wrap}
.metric{flex:1 1 180px;max-width:290px;text-align:left;background:transparent;border:0;border-bottom:3px solid var(--ink);border-radius:0;padding:22px 0;box-shadow:none}
.metric b{display:block;font-size:clamp(35px,4.4vw,64px);letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.metric span{display:block;margin-top:6px;color:var(--muted);font-size:clamp(13px,1.05vw,16px);line-height:1.35}
.table{width:100%;border-collapse:collapse;background:transparent;border:0;box-shadow:none}
.table th,.table td{padding:clamp(11px,1.1vw,16px);text-align:left;border-bottom:1px solid #e9ede9;font-size:clamp(13px,1.05vw,16px);line-height:1.36;vertical-align:top}
.table th{background:transparent;color:#526057;font-size:clamp(11px,.9vw,14px);text-transform:uppercase;letter-spacing:.08em;border-top:2px solid var(--ink)}
.table tr:last-child td{border-bottom:0}
.tag{display:inline-flex;padding:5px 10px;border-radius:999px;background:#edf0ed;color:#536158;font-size:12px;font-weight:850}
.tag.g{background:var(--green2);color:#126636}.tag.r{background:var(--red2);color:#a43128}.tag.a{background:var(--amber2);color:#86560c}
.checklist{width:100%;list-style:none}
.checklist li{position:relative;padding:12px 10px 12px 42px;border-bottom:1px solid var(--line);font-size:clamp(16px,1.35vw,20px);line-height:1.4}
.checklist li:before{content:"✓";position:absolute;left:9px;color:var(--green);font-weight:950}
.step{opacity:.14;transform:translateY(7px);transition:opacity .28s ease,transform .28s ease}
.step.shown{opacity:1;transform:none}
.progress{position:fixed;z-index:30;top:0;left:0;height:4px;background:var(--green);transition:width .25s}
.counter{position:fixed;z-index:30;bottom:17px;right:26px;color:#aeb7b0;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.hint{position:fixed;z-index:30;bottom:17px;left:50%;transform:translateX(-50%);color:#bcc4be;font-size:11px}
.counter{display:block}.hint{display:none}
.zone{position:fixed;z-index:20;top:0;bottom:0;width:8vw;border:0;background:transparent;cursor:pointer}.zone.prev{left:0}.zone.next{right:0}
.branch{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(520px,1.7fr);gap:clamp(36px,5vw,74px);align-items:center;width:100%;margin-top:6px}
.branch-core{display:flex;flex-direction:column;align-items:center;justify-content:center;width:clamp(220px,25vw,330px);height:clamp(220px,25vw,330px);border:8px solid var(--green);border-radius:50%;font-size:clamp(45px,6vw,84px);font-weight:950;line-height:.9;text-align:center;letter-spacing:-.06em}
.branch-core span{font-size:.42em;letter-spacing:.06em}.branch-core b{font-size:1em}
.branch-list{position:relative;display:flex;flex-direction:column;gap:clamp(24px,3.3vh,42px)}
.branch-list:before{content:"";position:absolute;left:-45px;top:12%;bottom:12%;width:4px;background:var(--green)}
.branch-item{position:relative;display:grid;grid-template-columns:minmax(170px,.65fr) minmax(300px,1.35fr);gap:22px;align-items:center;min-height:92px;border-bottom:1px solid #cfd7d0}
.branch-item:last-child{border-bottom:0}
.branch-item:before{content:"";position:absolute;left:-45px;top:50%;width:38px;height:4px;background:currentColor}
.branch-item:after{content:"";position:absolute;left:-10px;top:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:currentColor}
.branch-item.g{color:var(--green)}.branch-item.b{color:var(--blue)}.branch-item.a{color:var(--amber)}.branch-item.r{color:var(--red)}
.branch-item b{color:var(--ink);font-size:clamp(24px,2.4vw,36px);letter-spacing:-.03em}
.branch-item span{color:#4c5950;font-size:clamp(15px,1.25vw,19px);line-height:1.42}
.condition-line{width:100%;color:#46544b;font-family:Consolas,"Courier New",monospace;font-size:clamp(15px,1.35vw,20px);line-height:1.4}
.split{display:grid;grid-template-columns:1fr 1px 1fr;gap:clamp(28px,4vw,58px);align-items:stretch;width:100%}
.split-line{background:#cfd7d0}
.split-side{display:flex;flex-direction:column;justify-content:center;gap:14px;min-height:280px}
.split-side .number{display:block;width:auto;height:auto;border-radius:0;background:transparent;color:var(--green);font-size:clamp(12px,1vw,15px);letter-spacing:.12em;text-transform:uppercase;margin:0}
.split-side b{font-size:clamp(34px,4.5vw,66px);line-height:1;letter-spacing:-.05em}
.split-side p{max-width:520px}
.discussion .canvas{max-width:1160px;align-items:flex-start;justify-content:center;text-align:left}
.discussion h2{max-width:1080px;font-size:clamp(34px,4vw,58px);line-height:1.06}
.prompt-list{width:100%;max-width:1080px;border-top:2px solid var(--ink)}
.prompt-list p{padding:clamp(12px,1.7vh,20px) 0;border-bottom:1px solid #cbd4cc;font-size:clamp(22px,2.25vw,34px);line-height:1.24;font-weight:800;letter-spacing:-.025em}
.prompt-footer{max-width:920px;color:var(--muted);font-size:clamp(14px,1.2vw,18px);line-height:1.45}
.thesis{width:100%;display:grid;grid-template-columns:minmax(240px,.7fr) minmax(540px,1.3fr);gap:54px;align-items:start}
.thesis-key{font-size:clamp(62px,8vw,116px);font-weight:950;line-height:.9;color:var(--green);letter-spacing:-.07em}
.thesis-copy{font-size:clamp(23px,2.5vw,37px);font-weight:800;line-height:1.25}
.thesis-copy b,.thesis-copy span{display:block}.thesis-copy span{margin-top:14px;color:#536158;font-size:.58em;line-height:1.45;font-weight:600;letter-spacing:0}
.thesis.compact{grid-template-columns:minmax(110px,.25fr) minmax(540px,1.75fr);gap:30px;align-items:center}.thesis.compact .thesis-key{font-size:clamp(50px,6vw,84px)}
.ledger{width:100%;border-top:1px solid #cbd4cc}
.ledger-row{display:grid;grid-template-columns:minmax(170px,.44fr) minmax(360px,1.56fr);gap:24px;align-items:center;min-height:clamp(52px,6.6vh,74px);padding:6px 0;border-bottom:1px solid #cbd4cc}
.ledger-row b{font-size:clamp(17px,1.55vw,24px)}.ledger-row span{color:#536158;font-size:clamp(14px,1.15vw,18px);line-height:1.42}
.scenario-answer{display:block;margin-top:7px;color:var(--ink)!important;font-weight:780}
.scenario-answer b{font-size:inherit;color:var(--green)}
.homework-inline{width:100%;margin-top:14px;padding-top:12px;border-top:2px solid var(--green);font-size:clamp(15px,1.15vw,18px);line-height:1.4;color:#536158}
.homework-inline b{color:var(--ink)}
.reliability-compare{display:grid;grid-template-columns:1fr auto 1.2fr;gap:clamp(22px,3vw,46px);align-items:center;width:100%;margin:4px 0 12px}
.reliability-side{min-height:175px;display:flex;flex-direction:column;justify-content:center;border-bottom:5px solid var(--red)}
.reliability-side b{font-size:clamp(54px,6.5vw,92px);line-height:.9;letter-spacing:-.06em}
.reliability-side span{margin-top:14px;font-size:clamp(20px,1.9vw,28px);font-weight:850}
.reliability-side small{margin-top:8px;color:var(--muted);font-size:clamp(14px,1.05vw,17px);line-height:1.4}
.reliability-side.stable{border-color:var(--green)}.reliability-side.stable b{color:var(--green);font-size:clamp(42px,5.2vw,74px)}
.reliability-op{color:#9ca79f;font-size:clamp(48px,6vw,82px);font-weight:500}
.validation-core{display:grid;grid-template-columns:minmax(210px,.52fr) minmax(360px,1.08fr) minmax(190px,.4fr);gap:clamp(20px,2.4vw,38px);align-items:center;width:100%;padding:14px 0;border-top:1px solid #cbd4cc;border-bottom:1px solid #cbd4cc}
.validation-core b{font-size:clamp(23px,2.3vw,34px);line-height:1.15;color:var(--green)}
.validation-core span{font-size:clamp(16px,1.35vw,20px);line-height:1.5;color:#48564d}
.validation-thumb{display:block;width:100%;max-width:230px;max-height:175px;justify-self:end;object-fit:contain;border:1px solid #d7ded8;background:#fff}
.business-promise{width:100%;font-size:clamp(20px,1.85vw,27px);line-height:1.35;font-weight:850}
.statement-slide .canvas{align-items:center;justify-content:center;text-align:center}
.statement-text{max-width:1320px;font-size:clamp(42px,5vw,76px);line-height:1.12;font-weight:950;letter-spacing:-.045em}
.cycle{display:flex;align-items:center;width:100%;gap:8px;margin-top:20px}
.cycle-step{flex:1;text-align:center;padding:20px 8px;border-bottom:4px solid var(--green);font-size:clamp(16px,1.4vw,21px);font-weight:850}
.cycle-step b,.cycle-step span{display:block}.cycle-step span{margin-top:8px;color:var(--muted);font-size:.75em;line-height:1.35;font-weight:600}
.source{display:none}
.meme-layout{display:grid;grid-template-columns:minmax(280px,.72fr) minmax(520px,1.28fr);gap:clamp(34px,5vw,74px);align-items:center;width:100%}
.meme-layout.reverse{grid-template-columns:minmax(520px,1.28fr) minmax(280px,.72fr)}
.meme-art{display:block;width:100%;height:min(56vh,520px);object-fit:contain;object-position:center}
.meme-art.wide{height:auto;max-height:min(46vh,410px)}
.meme-copy{display:flex;flex-direction:column;gap:16px}
.meme-copy .punchline{font-size:clamp(25px,2.8vw,41px);line-height:1.12;font-weight:950;letter-spacing:-.04em}
.meme-copy p{max-width:620px;font-size:clamp(16px,1.45vw,21px)}
.attribution{display:none}
.selective-hero{display:grid;grid-template-columns:3fr 2fr;gap:clamp(28px,5vw,70px);width:100%;align-items:end}
.selective-block{min-height:320px;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:24px;border-bottom:8px solid var(--green)}
.selective-block.unknown{border-color:#aeb7b0}.selective-block b{font-size:clamp(90px,12vw,170px);line-height:.78;letter-spacing:-.08em}.selective-block span{margin-top:24px;font-size:clamp(22px,2vw,30px);font-weight:850}.selective-block small{margin-top:8px;color:var(--muted);font-size:clamp(14px,1.15vw,18px);line-height:1.4}
.selective-block.unknown b{color:#7d8980}.selective-block.unknown span{color:#59655d}
.policy-loop{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto 1.25fr;gap:clamp(10px,1.5vw,22px);align-items:center;width:100%}
.policy-node{min-height:240px;display:flex;flex-direction:column;justify-content:center;border-bottom:5px solid var(--line)}
.policy-node b{font-size:clamp(25px,2.5vw,38px);line-height:1.05}.policy-node span{margin-top:12px;color:var(--muted);font-size:clamp(14px,1.1vw,17px);line-height:1.4}
.policy-node.key{border-color:var(--green)}.policy-node.key b{color:var(--green);font-size:clamp(34px,3.5vw,52px)}
.policy-arrow{color:#9ca79f;font-size:clamp(28px,3vw,44px)}
.loop-result{width:100%;font-size:clamp(21px,2.2vw,33px);line-height:1.25;font-weight:850}
.business-tension{display:grid;grid-template-columns:1fr 1px 1fr;gap:clamp(34px,5vw,72px);align-items:center;width:100%;margin:14px 0}
.business-side{display:flex;flex-direction:column;justify-content:center;min-height:250px}.business-side b{font-size:clamp(58px,7.4vw,104px);line-height:.85;letter-spacing:-.07em}.business-side span{margin-top:20px;color:var(--muted);font-size:clamp(22px,2.2vw,33px);font-weight:800}.business-side:last-child b{color:var(--green)}
.business-divider{height:100%;background:#cbd4cc}
.target-rule{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:clamp(18px,2.5vw,38px);align-items:center;width:100%;margin-top:10px}
.target-part{min-height:210px;display:flex;flex-direction:column;justify-content:center;border-bottom:5px solid var(--ink)}
.target-part b{font-size:clamp(60px,7.6vw,110px);line-height:.9;letter-spacing:-.07em}.target-part span{margin-top:14px;color:var(--muted);font-size:clamp(16px,1.35vw,21px);line-height:1.35}
.target-part.result{border-color:var(--red)}.target-part.result b{color:var(--red)}
.target-op{color:#aeb7b0;font-size:clamp(32px,4vw,58px);font-weight:500}

<body>
<div class="progress" id="progress"></div>
<main class="deck" id="deck"></main>
<div class="counter"><span id="current">1</span> / <span id="total">1</span></div>
<div class="hint">← назад · → или Space: показать / дальше · F: полный экран</div>
<button class="zone prev" id="prev" aria-label="Предыдущий шаг"></button>
<button class="zone next" id="next" aria-label="Следующий шаг"></button>
<script>
const A = '<span class="arrow">→</span>';
const flow = items => `<div class="flow">${items.map((x,i)=>`${i?A:''}<div class="node ${x.c||''}"><b>${x.t}</b>${x.s?`<span>${x.s}</span>`:''}</div>`).join('')}</div>`;
const cards = (items,n=3) => `<div class="grid${n}">${items.map(x=>`<div class="card ${x.c||''} ${x.step?'step':''}">${x.n?`<span class="number">${x.n}</span>`:''}<h3>${x.t}</h3>${x.p?`<p>${x.p}</p>`:''}${x.list?`<ul>${x.list.map(v=>`<li>${v}</li>`).join('')}</ul>`:''}</div>`).join('')}</div>`;
const ledger = rows => `<div class="ledger">${rows.map(r=>`<div class="ledger-row"><b>${r.t}</b><span>${r.s}</span></div>`).join('')}</div>`;
const S = (section,eyebrow,title,html,cls='') => ({section,eyebrow,title,html,cls});

// шесть шагов постановки, порядок задаёт структуру дека
const CHAIN = [
  'Бизнес-задача','Target','Данные','Экономика риска','Метрики','Проверка'
];
const STAGE_TITLES = [
  'Истинная бизнес-цель редко лежит в первой формулировке',
  'Target не лежит готовым в базе: его задаёт банк',
  'История показывает только тех, кому банк уже решил выдать кредит',
  'Одинаковый PD может стоить банку совершенно разных денег',
  'Хороший Gini ещё не гарантирует хорошую стратегию',
  'Честный тест должен быть похож на будущую выдачу'
];
const STAGE_VISUALS = [
  '<b>Симптом</b><i>≠</i><b>задача</b>',
  '',
  '',
  '<b>PD</b><i>×</i><b>LGD</b><i>×</i><b>EAD</b>',
  '<b>Gini</b><i>≠</i><b>прибыль</b>',
  '<b>Прошлое</b><i>→</i><b>будущее</b>'
];
const chainMini = n => `<div class="chain-mini">${CHAIN.map((t,i)=>
  `${i?'<i>→</i>':''}${i===n-1?`<b>${t}</b>`:`<span>${t}</span>`}`).join('')}</div>`;
const divider = (n,claim) => S(`Шаг ${n}`,`Шаг ${n} из 6`,STAGE_TITLES[n-1],
  `<div class="stage-row ${STAGE_VISUALS[n-1]?'':'single'}"><p class="section-answer">${claim}</p>${STAGE_VISUALS[n-1]?`<div class="stage-signal">${STAGE_VISUALS[n-1]}</div>`:''}</div>${chainMini(n)}`,'section-break');

const allSlides = [
S('Титул','','Кредитный скоринг',`
  <p class="cover-subtitle">Как найти настоящую задачу бизнеса до обучения первой модели</p>
  <img class="cover-image" src="data/social_credit.jpg" alt="Мем о социальном кредитном рейтинге">
`,'center cover'),

S('Фраза бизнеса','Запрос','',`
  <div class="quote">«Просрочка выросла. Нужна модель надёжности клиента»
    <small>Владелец розничного кредитного продукта, микрокредиты до 10 млн сум</small>
  </div>
  <p class="lead">«Нужна модель» ещё не является задачей. Сначала нужно определить решение банка и критерий успеха проекта.</p>
`),

divider(1,'За фразой «просрочка выросла» скрываются три вопроса: какие выдачи сохранить, какой риск принять и сколько банк готов потерять.'),

S('Два требования','Запрос бизнеса','Бизнес-цель: меньше просрочки при сохранении выдач',`
  <div class="business-tension">
    <div class="business-side">
      <b>СНИЗИТЬ</b>
      <span>просрочку</span>
    </div>
    <div class="business-divider"></div>
    <div class="business-side">
      <b>СОХРАНИТЬ</b>
      <span>выдач</span>
    </div>
  </div>
  <p class="lead">Просрочку можно обнулить, отказав почти всем. Выдачи можно сохранить, одобряя всех подряд. Оба требования вместе задают границы будущей кредитной стратегии.</p>
`),

S('Чего нет во фразе','Постановка','Пять вещей, которых нет в запросе бизнеса',`
  ${ledger([
    {t:'Действие',s:'Что банк сделает иначе: одобрит заявку, изменит лимит или изменит ставку'},
    {t:'Событие',s:'Какой исход считается плохим и через сколько месяцев он становится виден'},
    {t:'Популяция',s:'Какие заявки попадают в модель: продукт, канал, повторные клиенты'},
    {t:'Данные',s:'Что известно банку до решения, а что появляется только после выдачи'},
    {t:'Критерий',s:'Какой результат разрешает запуск модели, а какой останавливает проект'}
  ])}
`),

S('Виды скоринга','Карта','Вид скоринга определяется моментом решения и целевым событием',`
  ${flow([
    {c:'g',t:'Application',s:'Новая заявка. Одобрение, лимит и ставка. Target: дефолт после выдачи.'},
    {c:'b',t:'Behavioral',s:'Действующий клиент. Пересмотр лимита или новое предложение. Target: риск в ближайшие месяцы.'},
    {c:'a',t:'Collection',s:'Клиент уже в просрочке. Приоритет и способ контакта. Target: платёж или возврат в график.'},
    {c:'r',t:'Fraud',s:'Заявка или транзакция. Блокировка или проверка. Target: мошенничество, а не кредитный дефолт.'}
  ])}
  <p class="lead">Названия похожи, но это разные задачи: меняются момент расчёта, доступные данные, действие банка и target.</p>
`),

S('Шесть шагов','Порядок работы','За фразой «нужна модель» скрываются шесть решений',`
  <div class="chain">
    <div class="chain-step"><i>1</i><div><b>Бизнес-задача</b><span>что просит бизнес и что ограничивает</span></div></div>
    <div class="chain-step"><i>2</i><div><b>Формирование target</b><span>правило, по которому появляется столбец y</span></div></div>
    <div class="chain-step"><i>3</i><div><b>Ограничения данных</b><span>что известно в момент решения</span></div></div>
    <div class="chain-step"><i>4</i><div><b>Экономика риска</b><span>как PD и условия кредита превращаются в деньги</span></div></div>
    <div class="chain-step"><i>5</i><div><b>Метрики модели и стратегии</b><span>что считаем результатом модели и портфеля</span></div></div>
    <div class="chain-step"><i>6</i><div><b>Проверка на будущем периоде</b><span>как повторить будущее применение</span></div></div>
  </div>
  <p class="chain-note">Риск не выделен в отдельный блок: его смысл раскрывается через target, условия кредита и ожидаемые потери.</p>
`),

S('Инструмент раньше задачи','Ошибка','Команда слишком рано начинает думать про CatBoost',`
  <div class="meme-layout">
    <img class="meme-art" src="data/ml-meme-war-this-is-one-of-my-favourite-machine-learning-v0-nc5ua4x8lfg31.webp" alt="Мем: человек режет простую еду огромным мечом с подписью deep learning">
    <div class="meme-copy">
      <div class="punchline">«Нужна модель» слышится команде как «нужен CatBoost»</div>
      <p>Пока не названы действие банка, целевое событие и горизонт наблюдения, любой алгоритм будет обучен на произвольно выбранной метке.</p>
      <p>Ни один из шести шагов не начинается с обучения модели.</p>
    </div>
  </div>
`),

divider(2,'Банк заранее выбирает событие, горизонт и серую зону. Из этого правила появляется y.'),

S('Сценарии target','Практика','Для каждого сценария соберите таргет',`
  ${ledger([
    {t:'Новая заявка',s:'Микрозайм на 6 месяцев. Банк решает, выдавать ли кредит.<span class="scenario-answer"><b>Один вариант target:</b> 90+ дней просрочки в первые 6 месяцев после выдачи. Незрелые договоры исключаются.</span>'},
    {t:'Действующий клиент',s:'Банк ежемесячно решает, увеличить ли лимит по карте.<span class="scenario-answer"><b>Один вариант target:</b> 30+ дней просрочки в следующие 3 месяца после даты расчёта behavioral score.</span>'},
    {t:'Клиент в просрочке',s:'Просрочка уже достигла 15 дней. Банк выбирает приоритет контакта.<span class="scenario-answer"><b>Один вариант target:</b> платёж или возврат в график в течение 14 дней после контакта.</span>'}
  ])}
`,'discussion'),

S('Правило bad','Target','Bad не лежит готовым в базе: его определяет банк',`
  <div class="target-rule">
    <div class="target-part">
      <b>90+</b>
      <span>дней просрочки</span>
    </div>
    <div class="target-op">×</div>
    <div class="target-part">
      <b>12</b>
      <span>месяцев наблюдения</span>
    </div>
    <div class="target-op">=</div>
    <div class="target-part result">
      <b>BAD</b>
      <span>положительный класс</span>
    </div>
  </div>
  <p class="target-remark">Это правило задаёт долю положительного класса, цену ошибки и требование к глубине истории. Три вещи сразу.</p>
`),

S('Серая зона','Target','Между good и bad остаётся серая зона',`
  <div class="seg">
    <div class="seg-part g"><b>0-29 дней</b><span>Платежи идут или договор закрыт. Класс good.</span></div>
    <div class="seg-part a"><b>30-89 дней</b><span>Часть договоров вернётся в график, часть уйдёт дальше. Класс не определён.</span></div>
    <div class="seg-part r"><b>90+ дней</b><span>Просрочка внутри окна наблюдения. Класс bad.</span></div>
  </div>
  <p class="lead">Серую зону либо исключают из обучения, либо относят к одному из классов. Основание для выбора даёт roll-rate: доля договоров из 30-89 дней, которая в следующие месяцы переходит в 90+.</p>
  <p class="small">Решение по серой зоне фиксируется до обучения и записывается в постановку.</p>
`),

    <li>Правило bad меняют с 90+ на 60+. Что придётся пересчитать до обучения модели?</li>
    <li>Признак известен только через месяц после выдачи. Чем это опасно при реальном применении?</li>
  </ol>
  <p class="homework-inline"><b>Домашнее задание:</b> на одной странице соберите паспорт скорингового решения: действие, target, данные в t0, проверка и метрики. Код не требуется.</p>
`),

S('Домашнее задание','Домашнее задание','Паспорт скорингового решения',`
  <ul class="checklist">
    <li>Назвать действие, которое будет зависеть от оценки риска: одобрение, лимит или ставка.</li>
    <li>Определить bad, горизонт наблюдения, популяцию и правило для серой зоны.</li>
    <li>Нарисовать окна наблюдения, решения и созревания метки на одной шкале.</li>

    <li>Предложить разделение по времени и проверку пересечения ID клиентов.</li>
    <li>Выбрать метрику модели, метрику портфеля и два ограничения стратегии.</li>
    <li>Описать одно допущение, которое невозможно проверить на исторических данных.</li>
  </ul>
  <p class="lead">Формат сдачи: одна страница. Код и обучение модели не требуются.</p>
`),

// слайды ниже не входят в основной прогон, включаются добавлением в deckOrder
S('Ручные решения','Переопределения','Эксперт может казаться точнее модели из-за отбора',`
  <div class="split">
    <div class="split-side">
      <span class="number">Одобрение эксперта</span>
      <h3>Исход наблюдается</h3>
      <p>Эксперт одобрил клиента вопреки модели. Через год банк увидит фактический платёжный результат.</p>
    </div>
    <div class="split-line"></div>
    <div class="split-side">
      <span class="number">Отказ эксперта</span>
      <h3>Исход не наблюдается</h3>
      <p>Эксперт отказал вопреки модели. Его ошибка остаётся невидимой в данных банка.</p>
    </div>
  </div>
  <p class="small">Сравнение «эксперт против модели» без учёта этой асимметрии всегда в пользу эксперта.</p>
`),

S('Вопрос про прогноз','Вопрос','Что должен предсказывать скоринг?',`
  <div class="prompt-list">
    <p>Вероятность дефолта клиента</p>
    <p>Убыток по заявке</p>
    <p>Решение «выдать или отказать»</p>
  </div>
  <p class="prompt-footer">Выберите один вариант и объясните, какое действие по заявке он улучшает.</p>
`,'discussion')
];

const deckOrder = [
  'Титул',
  'Фраза бизнеса',
  'Шаг 1','Два требования','Чего нет во фразе','Виды скоринга','Шесть шагов','Инструмент раньше задачи',
  'Шаг 2','Сценарии target',
  'Шаг 3','Смещённая выборка','Новые клиенты',
  'Шаг 4','Ожидаемые потери','Цена ошибки',
  'Шаг 5','Стратегия и прибыль','Gini и деньги',
  'Схема проверки','Надёжный сценарий',
  'Мем про BRD',
  'Шпаргалка','Проверь себя'
];
const slides = deckOrder.map(section => allSlides.find(slide => slide.section === section)).filter(Boolean);

function render(){
  document.getElementById('deck').innerHTML=slides.map((s,i)=>`
    <section class="slide ${s.cls}" data-index="${i+1}" data-section="${s.section}">
      <div class="canvas">
        ${s.eyebrow?`<p class="eyebrow">${s.eyebrow}</p>`:''}
        ${s.title?(i===0?`<h1>${s.title}</h1>`:`<h2>${s.title}</h2>`):''}
        ${s.html}
      </div>
    </section>`).join('');
}
render();
const els=[...document.querySelectorAll('.slide')];
let current=0;
document.getElementById('total').textContent=els.length;
function steps(slide){return [...slide.querySelectorAll('.step')]}
function resetSteps(slide){steps(slide).forEach(x=>x.classList.remove('shown'))}
function showAll(slide){steps(slide).forEach(x=>x.classList.add('shown'))}
function go(n,hash=true){
  els[current]?.classList.remove('active');
  current=(n+els.length)%els.length;
  els[current].classList.add('active');
  resetSteps(els[current]);
  document.getElementById('current').textContent=current+1;
  document.getElementById('progress').style.width=((current+1)/els.length*100)+'%';
  if(hash)history.replaceState(null,'','#'+(current+1));
}
function forward(){
  const hidden=steps(els[current]).find(x=>!x.classList.contains('shown'));
  if(hidden){hidden.classList.add('shown');return}
  go(current+1);
}
function backward(){
  const shown=steps(els[current]).filter(x=>x.classList.contains('shown'));
  if(shown.length){shown[shown.length-1].classList.remove('shown');return}
  go(current-1);showAll(els[current]);
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'||e.key==='Enter'){e.preventDefault();forward()}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();backward()}
  if(e.key==='Home'){e.preventDefault();go(0)}
  if(e.key==='End'){e.preventDefault();go(els.length-1)}
  if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.()}
});
document.getElementById('prev').addEventListener('click',backward);
document.getElementById('next').addEventListener('click',forward);
let touchX=0;
document.addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>45)(dx<0?forward():backward())},{passive:true});
const initial=parseInt((location.hash||'#1').slice(1),10);
go(Number.isFinite(initial)&&initial>=1&&initial<=els.length?initial-1:0,false);
</script>
