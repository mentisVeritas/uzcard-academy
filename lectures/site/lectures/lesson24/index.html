    <li>В таблицах банка нет колонки «ушёл». Есть только транзакции. <b>Таргет - результат формализации бизнес-вопроса</b>, и эту работу выполняет аналитик до всякого машинного обучения.</li>
    <li>Наша формализация: клиент считается ушедшим, если после контрольной даты он <b>не совершил ни одной успешной операции за два месяца</b>.</li>
    <li>Горизонт в два месяца - решение бизнеса. Более короткое окно запишет в «ушедшие» клиентов в отпуске; более длинное - служба удержания узнаёт об уходе слишком поздно.</li>
    <li>Другая формализация - другая задача. «Активность снизилась вдвое» или «закрыл карту» дают другой таргет, другую модель и другой список на обзвон.</li>
  </ul>
  <div class=&quot;note orange&quot; style=&quot;max-width:860px;&quot;><p>Качество формализации таргета ограничивает качество всей системы: ошибку, заложенную на этом шаге, не исправит ни один алгоритм.</p></div>
</div>
</div>

<!-- 09 TARGET 3: SQL -->
<div class=&quot;slide&quot;>
<div class=&quot;sc&quot;>
  <p class=&quot;eyebrow&quot;>Построение таргета · 5 из 5</p>
  <h2>Сборка выборки средствами SQL</h2>
  <div class=&quot;codebox&quot; style=&quot;max-width:940px;&quot;>
    <div class=&quot;codebar&quot;><span>churn_dataset.sql</span></div>
    <div class=&quot;code&quot; style=&quot;font-size:clamp(10px,.95vw,12.5px);line-height:1.6;&quot;><span class=&quot;cte&quot;><span class=&quot;kw&quot;>WITH</span> activity <span class=&quot;kw&quot;>AS</span> (   <span class=&quot;cm&quot;>-- признаки: три месяца до контрольной даты</span>
  <span class=&quot;kw&quot;>SELECT</span> ca.customer_id, <span class=&quot;fn&quot;>COUNT</span>(*) <span class=&quot;kw&quot;>AS</span> txn_count, <span class=&quot;fn&quot;>SUM</span>(t.amount_uzs) <span class=&quot;kw&quot;>AS</span> txn_sum,
         <span class=&quot;fn&quot;>COUNT</span>(<span class=&quot;kw&quot;>DISTINCT</span> t.txn_ts::date) <span class=&quot;kw&quot;>AS</span> n_active_days
  <span class=&quot;kw&quot;>FROM</span> ds_transactions_2 t <span class=&quot;kw&quot;>JOIN</span> ds_cards ca <span class=&quot;kw&quot;>USING</span> (card_id)
  <span class=&quot;kw&quot;>WHERE</span> t.txn_ts &amp;gt;= <span class=&quot;st&quot;>'2023-08-01'</span> <span class=&quot;kw&quot;>AND</span> t.txn_ts &amp;lt; <span class=&quot;st&quot;>'2023-10-30'</span>
  <span class=&quot;kw&quot;>GROUP BY</span> ca.customer_id),
future <span class=&quot;kw&quot;>AS</span> (       <span class=&quot;cm&quot;>-- операции после контрольной даты</span>
  <span class=&quot;kw&quot;>SELECT DISTINCT</span> ca.customer_id
  <span class=&quot;kw&quot;>FROM</span> ds_transactions_2 t <span class=&quot;kw&quot;>JOIN</span> ds_cards ca <span class=&quot;kw&quot;>USING</span> (card_id)
  <span class=&quot;kw&quot;>WHERE</span> t.txn_ts &amp;gt;= <span class=&quot;st&quot;>'2023-10-30'</span>)</span>
<span class=&quot;kw&quot;>SELECT</span> a.*, <span class=&quot;sq&quot;><span class=&quot;kw&quot;>CASE WHEN</span> f.customer_id <span class=&quot;kw&quot;>IS NULL THEN</span> 1 <span class=&quot;kw&quot;>ELSE</span> 0 <span class=&quot;kw&quot;>END AS</span> churned</span>
<span class=&quot;kw&quot;>FROM</span> activity a <span class=&quot;kw&quot;>LEFT JOIN</span> future f <span class=&quot;kw&quot;>USING</span> (customer_id);</div>
  </div>
  <div class=&quot;note green&quot; style=&quot;max-width:940px;&quot;><p>Первый CTE считает признаки по окну до даты, второй фиксирует активность после, <span class=&quot;mono&quot;>CASE WHEN</span> превращает её в таргет. Это инструменты блока 2: сборка выборки для ML - обычная SQL-задача. На практике сегодня вы соберёте датасет занятия сами - из сырого журнала транзакций, средствами pandas и SQL.</p></div>
</div>

    <li><b>Базовая модель (baseline)</b> - простейшее решение задачи, не требующее обучения. Она отвечает на вопрос: «что мы получаем бесплатно?»</li>
    <li>Для классификации стандартный baseline - <b>всегда предсказывать самый частый класс</b>. Для регрессии - предсказывать среднее значение.</li>
    <li>Baseline строится <b>до</b> сложных моделей. Любая модель, не превосходящая его, не имеет ценности независимо от красоты алгоритма.</li>
  </ul>
  <div class=&quot;codebox&quot; style=&quot;margin-top:12px;&quot;>
    <div class=&quot;codebar&quot;><span>ml01_classwork.ipynb</span></div>
    <div class=&quot;code&quot; style=&quot;font-size:clamp(10.5px,1vw,13.5px);&quot;><span class=&quot;cl&quot; style=&quot;--i:0&quot;><span class=&quot;kw&quot;>from</span> sklearn.dummy <span class=&quot;kw&quot;>import</span> DummyClassifier</span><span class=&quot;cl&quot; style=&quot;--i:1&quot;> </span><span class=&quot;cl&quot; style=&quot;--i:2&quot;>baseline = <span class=&quot;fn&quot;>DummyClassifier</span>(strategy=<span class=&quot;st&quot;>'most_frequent'</span>)   <span class=&quot;cm&quot;># всегда самый частый класс</span></span><span class=&quot;cl&quot; style=&quot;--i:3&quot;>baseline.<span class=&quot;ovin&quot;>fit</span>(X_train, y_train)</span><span class=&quot;cl&quot; style=&quot;--i:4&quot;><span class=&quot;fn&quot;>accuracy_score</span>(y_test, baseline.<span class=&quot;ovin&quot;>predict</span>(X_test))   <span class=&quot;resbadge&quot;>0.700</span></span></div>
  </div>
  <div class=&quot;note blue&quot; style=&quot;max-width:920px;&quot;><p><b>Baseline - это не отдельная метрика, а та же accuracy.</b> Мы считаем ту же долю верных ответов той же функцией <span class=&quot;mono&quot;>accuracy_score</span> - только для примитивной модели. 0.700 у baseline и результат нашей модели измеряются одной линейкой: у нас появилась не новая шкала, а точка отсчёта на старой.</p></div>

<!-- 22c SCALER CONCEPT -->
<div class=&quot;slide&quot;>
<div class=&quot;sc&quot;>
  <p class=&quot;eyebrow&quot;>Стандартизация · 1 из 5</p>
  <h2>StandardScaler: приведение к общей шкале</h2>
  <p class=&quot;sub&quot; style=&quot;margin-top:0;&quot;>Из каждого значения вычитается среднее признака и результат делится на стандартное отклонение. После этого у признака среднее 0 и разброс 1 - разные признаки становятся сопоставимыми.</p>
  <div class=&quot;formula&quot; style=&quot;margin-top:14px;font-size:clamp(20px,2.6vw,34px);&quot;>
    <span class=&quot;fstep s1&quot;>x&amp;#8242; = (x - &amp;#956;) / &amp;#963;</span>
  </div>
  <p class=&quot;sub&quot; style=&quot;margin-top:8px;font-size:clamp(12px,1.3vw,15px);&quot;>&amp;#956; - среднее признака по обучающей выборке,&amp;nbsp;&amp;nbsp;&amp;#963; - его стандартное отклонение (standard deviation)</p>
  <p class=&quot;lbl&quot; style=&quot;margin-top:clamp(12px,2vh,22px);&quot;>какие ещё бывают</p>
  <div class=&quot;cards c3&quot; style=&quot;margin-top:6px;&quot;>
    <div class=&quot;card acc-blue&quot;><h4>MinMaxScaler</h4><p>Сжимает значения в диапазон [0, 1]: (x - min) / (max - min). Прост, но один выброс растягивает всю шкалу.</p></div>
    <div class=&quot;card acc-green&quot;><h4>RobustScaler</h4><p>Вместо среднего и отклонения берёт медиану и межквартильный размах. Устойчив к выбросам.</p></div>
    <div class=&quot;card acc-purple&quot;><h4>MaxAbsScaler</h4><p>Делит на максимум по модулю, сохраняя знак и нули. Применяется для разреженных данных.</p></div>
  </div>
  <div class=&quot;note blue&quot; style=&quot;max-width:1120px;&quot;><p>Выбор зависит от данных: при заметных выбросах берут RobustScaler, для нейросетей часто MinMaxScaler. Для kNN и линейных моделей StandardScaler - разумная точка старта. Разберём его подробно на нашем примере.</p></div>
</div>
</div>

function runCounters(slide){
  slide.querySelectorAll('[data-cnt]').forEach(el=>{
    const target=parseFloat(el.dataset.cnt), dec=parseInt(el.dataset.dec||'0'), pre=el.dataset.pre||'', suf=el.dataset.suf||'';
    const t0=performance.now(), dur=900;

}
function go(n){

  const sc=slides[cur].querySelector('.sc');

  slides[cur].querySelectorAll('.rise,.cl,.growx,.fl,.pstep,.pill,.resbadge,.mapnode,.mapline,.fstep').forEach(el=>{
    el.style.animation='none';void el.offsetWidth;el.style.animation='';

  runCounters(slides[cur]);
  document.getElementById('cur').textContent=cur+1;
  document.getElementById('prog').style.width=((cur+1)/slides.length*100)+'%';
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}
  if(e.key==='ArrowLeft'){e.preventDefault();go(cur-1);}
});
let tx=0;

document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1));},{passive:true});

<script>
/* kNN demo: draggable new client, adjustable k */
(function(){
  const svg=document.getElementById('knnsvg');
  if(!svg)return;
  const W=640,H=430,PL=54,PB=42,PT=14,PR=16;
  const plotW=W-PL-PR,plotH=H-PT-PB;
  function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
  const rnd=mulberry(7);
  function gauss(){let u=0,v=0;while(u===0)u=rnd();while(v===0)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
  const pts=[];
  for(let i=0;i<30;i++){pts.push({x:Math.min(58,Math.max(6,34+gauss()*11)),y:Math.min(70,Math.max(4,42+gauss()*13)),c:0});}
  for(let i=0;i<18;i++){pts.push({x:Math.min(30,Math.max(1,11+gauss()*6)),y:Math.min(45,Math.max(1,14+gauss()*8)),c:1});}
  let star={x:22,y:26};
  let K=5;
  const sx=v=>PL+v/60*plotW, sy=v=>PT+plotH-v/72*plotH;
  const NS='http://www.w3.org/2000/svg';
  function el(t,at){const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);return e;}
  function render(){
    svg.innerHTML='';
    svg.appendChild(el('line',{x1:PL,y1:PT+plotH,x2:PL+plotW,y2:PT+plotH,stroke:'#d8dbe2','stroke-width':1.5}));
    svg.appendChild(el('line',{x1:PL,y1:PT,x2:PL,y2:PT+plotH,stroke:'#d8dbe2','stroke-width':1.5}));
    const xl=el('text',{x:PL+plotW/2,y:H-8,'text-anchor':'middle',fill:'#888','font-size':'12','font-weight':'600'});
    xl.textContent='активных дней за 3 месяца';svg.appendChild(xl);
    const yl=el('text',{x:14,y:PT+plotH/2,fill:'#888','font-size':'12','font-weight':'600',transform:'rotate(-90 14 '+(PT+plotH/2)+')','text-anchor':'middle'});
    yl.textContent='стаж, месяцев';svg.appendChild(yl);
    const ds=pts.map((p,i)=>({i,d:Math.hypot((p.x-star.x)/60,(p.y-star.y)/72)})).sort((a,b)=>a.d-b.d).slice(0,K);
    const nb=new Set(ds.map(o=>o.i));
    ds.forEach(o=>{
      const p=pts[o.i];
      svg.appendChild(el('line',{x1:sx(star.x),y1:sy(star.y),x2:sx(p.x),y2:sy(p.y),stroke:'#e0820a','stroke-width':1.6,class:'nline',opacity:.8}));
    });
    pts.forEach((p,i)=>{
      if(nb.has(i))svg.appendChild(el('circle',{cx:sx(p.x),cy:sy(p.y),r:11,fill:'none',stroke:'#e0820a','stroke-width':2,opacity:.85}));
      svg.appendChild(el('circle',{cx:sx(p.x),cy:sy(p.y),r:6.5,fill:p.c?'#e02d20':'#0064d6',opacity:.88}));
    });
    const g=el('g',{transform:'translate('+sx(star.x)+' '+sy(star.y)+')',cursor:'grab'});
    g.appendChild(el('circle',{r:12,fill:'#e0820a',stroke:'#fff','stroke-width':2.5}));
    const st=el('text',{'text-anchor':'middle',dy:4,fill:'#fff','font-size':'12','font-weight':'800'});st.textContent='?';
    g.appendChild(st);svg.appendChild(g);
    const churnVotes=ds.filter(o=>pts[o.i].c===1).length;
    const stay=K-churnVotes;
    const verdict=churnVotes>stay;
    const kv=document.getElementById('kv'),kd=document.getElementById('kd');
    kv.textContent=verdict?'уйдёт':'останется';
    kv.style.color=verdict?'#e02d20':'#0064d6';
    kd.textContent='Голоса соседей: '+churnVotes+' «уйдёт», '+stay+' «останется», k = '+K+'.';
  }
  function toData(ev){
    const r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)*(W/r.width),py=(ev.clientY-r.top)*(H/r.height);
    return{x:Math.min(60,Math.max(0,(px-PL)/plotW*60)),y:Math.min(72,Math.max(0,(PT+plotH-py)/plotH*72))};
  }
  let drag=false;
  svg.addEventListener('pointerdown',ev=>{drag=true;svg.setPointerCapture(ev.pointerId);star=toData(ev);render();});
  svg.addEventListener('pointermove',ev=>{if(drag){star=toData(ev);render();}});
  svg.addEventListener('pointerup',()=>{drag=false;});
  document.querySelectorAll('.kbtn').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.kbtn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');K=parseInt(b.dataset.k);render();
    });
  });
  render();
})();
</script>

.bgdots{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.bgdots i{position:absolute;border-radius:50%;opacity:.16;animation:drift linear infinite;}
@keyframes drift{0%{transform:translate(0,0);}50%{transform:translate(var(--dx),var(--dy));}100%{transform:translate(0,0);}}

/* roadmap */
.map{width:100%;max-width:1080px;}
.mapnode{opacity:0;animation:pop .5s cubic-bezier(.2,1.6,.4,1) forwards;}
.mapnode.n1{animation-delay:.3s;}.mapnode.n2{animation-delay:.55s;}.mapnode.n3{animation-delay:.8s;}
.mapnode.n4{animation-delay:1.05s;}.mapnode.n5{animation-delay:1.3s;}.mapnode.n6{animation-delay:1.55s;}
.mapline{stroke-dasharray:1000;stroke-dashoffset:1000;animation:mapdraw 1.6s ease-out forwards;}
@keyframes mapdraw{to{stroke-dashoffset:0;}}
.heretick{animation:pulsr 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}

/* mini svg card animations */
.mini{width:100%;height:86px;margin-bottom:8px;background:#fafbfd;border:1px solid #f0f1f4;border-radius:10px;}
.drawline{stroke-dasharray:220;stroke-dashoffset:220;animation:draw 2.6s ease-in-out infinite;}
@keyframes draw{0%{stroke-dashoffset:220;}45%,70%{stroke-dashoffset:0;}100%{stroke-dashoffset:0;opacity:0;}}
.clu{animation:clumove 3.4s ease-in-out infinite;}
@keyframes clumove{0%,12%{transform:translate(0,0);}45%,80%{transform:translate(var(--tx),var(--ty));}100%{transform:translate(0,0);}}
.votebar{transform:scaleX(0);transform-origin:left;animation:grow 2.8s ease-in-out infinite;}
@keyframes grow{0%,10%{transform:scaleX(0);}50%,85%{transform:scaleX(1);}100%{transform:scaleX(0);}}
.pulse-r{animation:pulsr 2.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
@keyframes pulsr{0%,100%{opacity:.25;transform:scale(.8);}50%{opacity:.9;transform:scale(1.15);}}

/* churn leak animation */
.leak{width:100%;max-width:520px;height:170px;background:#fff;border:1.5px solid #e6e8ee;border-radius:14px;}
.walker{animation:walk 3.6s ease-in-out infinite;}
.walker.w2{animation-delay:1.7s;}
@keyframes walk{0%,25%{transform:translateX(0);opacity:1;}70%{transform:translateX(150px);opacity:.9;}95%,100%{transform:translateX(210px);opacity:0;}}

/* timeline */
.tl{width:100%;max-width:940px;height:110px;}
.growx{transform:scaleX(0);transform-origin:left;animation:gx 1.1s ease-out forwards;}
.growx.g2{animation-delay:.7s;}
@keyframes gx{to{transform:scaleX(1);}}
.cutline{animation:blink 1.8s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:.9;}50%{opacity:.3;}}

/* big numbers */
.bignum{display:flex;gap:clamp(12px,2vw,26px);margin-top:clamp(10px,1.6vh,20px);flex-wrap:wrap;justify-content:center;align-items:center;}
.bn{background:#fff;border:1.5px solid #e6e8ee;border-radius:16px;padding:clamp(12px,1.6vw,20px) clamp(18px,2.4vw,30px);text-align:center;min-width:210px;}
.bn .v{font-size:clamp(30px,4vw,52px);font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.bn .t{font-size:clamp(11px,1.1vw,13px);color:#6b6f76;font-weight:600;margin-top:2px;}
.bn.good{border-color:#b8dfc1;background:#f4fbf6;}.bn.good .v{color:#1a9d4a;}
.bn.bad{border-color:#f0c8c8;background:#fef7f6;}.bn.bad .v{color:#e02d20;}
.bn.gray .v{color:#4a4d53;}
.arrow-big{font-size:clamp(24px,3vw,40px);color:#c3c7cf;font-weight:300;}

/* formula box */
.formula{background:#fff;border:1.5px solid #e6e8ee;border-radius:14px;padding:clamp(14px,1.8vw,22px) clamp(18px,2.2vw,28px);font-family:'SF Mono','Consolas',monospace;font-size:clamp(13px,1.5vw,19px);text-align:center;margin-top:12px;line-height:2;max-width:960px;width:100%;overflow-x:auto;}
.formula .fstep{display:block;opacity:0;animation:up .5s ease-out forwards;}
.formula .fstep.s1{animation-delay:.3s;}.formula .fstep.s2{animation-delay:1s;}.formula .fstep.s3{animation-delay:1.7s;}
.formula .big{color:#e02d20;font-weight:800;}
.formula .sm{color:#e0820a;font-weight:700;}

/* distance contribution bars */
.dbars{width:100%;max-width:860px;margin-top:10px;text-align:left;}
.dbar{display:flex;align-items:center;gap:10px;margin:7px 0;}
.dbar .dn{width:130px;font-size:12.5px;font-weight:700;color:#4a4d53;font-family:'SF Mono','Consolas',monospace;}
.dbar .tr{flex:1;height:16px;background:#f0f1f4;border-radius:99px;overflow:hidden;}
.dbar .fl{height:100%;border-radius:99px;transform:scaleX(0);transform-origin:left;animation:gx .9s ease-out forwards;}
.dbar .dv{width:110px;font-size:12px;color:#6b6f76;font-variant-numeric:tabular-nums;text-align:right;}

/* before/after panels */
.morph2{display:flex;gap:clamp(10px,1.6vw,20px);margin-top:10px;flex-wrap:wrap;justify-content:center;}
.mpanel{background:#fff;border:1.5px solid #e6e8ee;border-radius:14px;padding:8px;}
.mpanel .cap{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#888;text-align:center;padding:4px 0 6px;}
.mpanel .sub2{font-size:clamp(10px,1vw,12px);color:#4a4d53;line-height:1.45;max-width:250px;padding:6px 6px 2px;text-align:left;font-weight:500;}
.legend{font-size:clamp(10.5px,1.05vw,12.5px);color:#4a4d53;font-weight:600;text-align:center;margin-top:8px;}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 3px 0 10px;vertical-align:baseline;}

/* pipeline */
.pipewrap{position:relative;width:fit-content;margin:clamp(14px,2.2vh,26px) auto 0;}
.pipe{display:flex;align-items:center;gap:clamp(8px,1.4vw,18px);flex-wrap:nowrap;justify-content:center;}
.pstep{background:#fff;border:2px solid #b8dfc1;border-radius:14px;padding:clamp(12px,1.6vw,20px) clamp(16px,2vw,26px);text-align:center;box-shadow:0 8px 20px -14px rgba(26,157,74,.4);opacity:0;animation:pop .5s cubic-bezier(.2,1.6,.4,1) forwards;}
.pstep:nth-child(1){animation-delay:.2s;}.pstep:nth-child(3){animation-delay:.5s;}.pstep:nth-child(5){animation-delay:.8s;}
.pstep .n{font-family:'SF Mono','Consolas',monospace;font-weight:700;font-size:clamp(14px,1.7vw,21px);color:#1a9d4a;}
.pstep .d{font-size:clamp(10px,1vw,12.5px);color:#6b6f76;margin-top:3px;font-weight:600;}
.parr{font-size:clamp(20px,2.6vw,34px);color:#1a9d4a;font-weight:300;animation:pulseA 1.6s ease-in-out infinite;}
.parr.d2{animation-delay:.8s;}
@keyframes pulseA{0%,100%{opacity:.35;transform:translateX(0);}50%{opacity:1;transform:translateX(5px);}}
.pdot{position:absolute;top:50%;left:0;width:12px;height:12px;border-radius:50%;background:#e0820a;box-shadow:0 0 0 4px rgba(224,130,10,.2);animation:ride 3s ease-in-out infinite;animation-delay:1.2s;}
@keyframes ride{0%{left:4%;opacity:0;}10%{opacity:1;}45%{left:48%;}90%{left:94%;opacity:1;}100%{left:96%;opacity:0;}}

/* kNN widget */
.knn-wrap{width:100%;max-width:960px;display:flex;gap:clamp(10px,1.6vw,20px);align-items:stretch;margin-top:8px;}
.knn-left{flex:1 1 620px;background:#fff;border:1.5px solid #e2e4ea;border-radius:14px;padding:10px;}
.knn-svg{width:100%;height:auto;display:block;touch-action:none;cursor:crosshair;}
.knn-side{flex:0 0 240px;display:flex;flex-direction:column;gap:10px;}
.kbtns{display:flex;gap:6px;}
.kbtn{flex:1;font-family:inherit;font-size:13px;font-weight:700;padding:8px 0;border-radius:9px;border:1.5px solid #d8dbe2;background:#fff;color:#2a2c30;cursor:pointer;transition:.15s;}
.kbtn:hover{border-color:#7c3aed;color:#7c3aed;}
.kbtn.on{background:#7c3aed;border-color:#7c3aed;color:#fff;}
.verdict{background:#fff;border:1.5px solid #e2e4ea;border-radius:12px;padding:12px 14px;text-align:left;}
.verdict .vt{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#888;margin-bottom:5px;}
.verdict .vv{font-size:clamp(16px,1.8vw,22px);font-weight:800;}
.verdict .vd{font-size:12.5px;color:#6b6f76;margin-top:4px;line-height:1.45;}
.legend{display:flex;gap:14px;font-size:12px;color:#4a4d53;font-weight:600;justify-content:center;margin-top:6px;}
.legend span:before{content:'●';margin-right:5px;}
.leg-stay:before{color:#0064d6;}.leg-churn:before{color:#e02d20;}.leg-new:before{color:#e0820a;}
.nline{stroke-dasharray:5 4;animation:march .7s linear infinite;}
@keyframes march{to{stroke-dashoffset:-9;}}

@media(max-width:860px){.cr,.cards.c3,.cards.c2,.cards.c4{grid-template-columns:1fr;}.knn-wrap{flex-direction:column;}.knn-side{flex-direction:row;flex-wrap:wrap;}}
</style>

    <div class=&quot;code&quot; style=&quot;font-size:clamp(10px,.95vw,12.5px);line-height:1.6;&quot;><span class=&quot;cte&quot;><span class=&quot;kw&quot;>WITH</span> activity <span class=&quot;kw&quot;>AS</span> (   <span class=&quot;cm&quot;>-- belgilar: nazorat sanasidan oldingi uch oy</span>
  <span class=&quot;kw&quot;>SELECT</span> ca.customer_id, <span class=&quot;fn&quot;>COUNT</span>(*) <span class=&quot;kw&quot;>AS</span> txn_count, <span class=&quot;fn&quot;>SUM</span>(t.amount_uzs) <span class=&quot;kw&quot;>AS</span> txn_sum,

  <span class=&quot;kw&quot;>FROM</span> ds_transactions_2 t <span class=&quot;kw&quot;>JOIN</span> ds_cards ca <span class=&quot;kw&quot;>USING</span> (card_id)

  <span class=&quot;kw&quot;>GROUP BY</span> ca.customer_id),
future <span class=&quot;kw&quot;>AS</span> (       <span class=&quot;cm&quot;>-- nazorat sanasidan keyingi operatsiyalar</span>
  <span class=&quot;kw&quot;>SELECT DISTINCT</span> ca.customer_id
  <span class=&quot;kw&quot;>FROM</span> ds_transactions_2 t <span class=&quot;kw&quot;>JOIN</span> ds_cards ca <span class=&quot;kw&quot;>USING</span> (card_id)
  <span class=&quot;kw&quot;>WHERE</span> t.txn_ts &amp;gt;= <span class=&quot;st&quot;>'2023-10-30'</span>)</span>
<span class=&quot;kw&quot;>SELECT</span> a.*, <span class=&quot;sq&quot;><span class=&quot;kw&quot;>CASE WHEN</span> f.customer_id <span class=&quot;kw&quot;>IS NULL THEN</span> 1 <span class=&quot;kw&quot;>ELSE</span> 0 <span class=&quot;kw&quot;>END AS</span> churned</span>

  <p class=&quot;eyebrow&quot;>Standartlashtirish · 1/5</p>
  <h2>StandardScaler: umumiy shkalaga keltirish</h2>
  <p class=&quot;sub&quot; style=&quot;margin-top:0;&quot;>Har bir qiymatdan belgining o'rtachasi ayiriladi va natija standart chetlanishga bo'linadi. Shundan keyin belgining o'rtachasi 0 va tarqoqligi 1 bo'ladi - turli belgilar taqqoslanadigan bo'ladi.</p>
  <div class=&quot;formula&quot; style=&quot;margin-top:14px;font-size:clamp(20px,2.6vw,34px);&quot;>
    <span class=&quot;fstep s1&quot;>x&amp;#8242; = (x - &amp;#956;) / &amp;#963;</span>
  </div>
  <p class=&quot;sub&quot; style=&quot;margin-top:8px;font-size:clamp(12px,1.3vw,15px);&quot;>&amp;#956; - o'quv namunasi bo'yicha belgining o'rtachasi,&amp;nbsp;&amp;nbsp;&amp;#963; - uning standart chetlanishi (standard deviation)</p>
  <p class=&quot;lbl&quot; style=&quot;margin-top:clamp(12px,2vh,22px);&quot;>yana qanday turlari bor</p>
  <div class=&quot;cards c3&quot; style=&quot;margin-top:6px;&quot;>
    <div class=&quot;card acc-blue&quot;><h4>MinMaxScaler</h4><p>Qiymatlarni [0, 1] oraliqqa siqadi: (x - min) / (max - min). Oddiy, lekin bitta chetlanish butun shkalani cho'zadi.</p></div>
    <div class=&quot;card acc-green&quot;><h4>RobustScaler</h4><p>O'rtacha va chetlanish o'rniga median va kvartillararo tarqalishni oladi. Chetlanishlarga chidamli.</p></div>
    <div class=&quot;card acc-purple&quot;><h4>MaxAbsScaler</h4><p>Modul bo'yicha maksimumga bo'ladi, ishora va nollarni saqlaydi. Siyrak ma'lumotlar uchun qo'llaniladi.</p></div>
  </div>
  <div class=&quot;note blue&quot; style=&quot;max-width:1120px;&quot;><p>Tanlov ma'lumotlarga bog'liq: sezilarli chetlanishlarda RobustScaler olinadi, neyron tarmoqlar uchun ko'pincha MinMaxScaler. kNN va chiziqli modellar uchun StandardScaler - oqilona boshlang'ich nuqta. Uni misolimizda batafsil ko'rib chiqamiz.</p></div>
</div>
</div>

const slides=document.querySelectorAll('.slide');

function runCounters(slide){
  slide.querySelectorAll('[data-cnt]').forEach(el=>{
    const target=parseFloat(el.dataset.cnt), dec=parseInt(el.dataset.dec||'0'), pre=el.dataset.pre||'', suf=el.dataset.suf||'';
    const t0=performance.now(), dur=900;

      const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);

      if(p<1)requestAnimationFrame(tick);

}
function go(n){

  cur=(n+slides.length)%slides.length;
  slides[cur].classList.add('active');
  const sc=slides[cur].querySelector('.sc');

  slides[cur].querySelectorAll('.rise,.cl,.growx,.fl,.pstep,.pill,.resbadge,.mapnode,.mapline,.fstep').forEach(el=>{
    el.style.animation='none';void el.offsetWidth;el.style.animation='';

  runCounters(slides[cur]);
  document.getElementById('cur').textContent=cur+1;
  document.getElementById('prog').style.width=((cur+1)/slides.length*100)+'%';
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}

<script>
/* kNN demo: draggable new client, adjustable k */
(function(){
  const svg=document.getElementById('knnsvg');
  if(!svg)return;
  const W=640,H=430,PL=54,PB=42,PT=14,PR=16;
  const plotW=W-PL-PR,plotH=H-PT-PB;
  function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
  const rnd=mulberry(7);
  function gauss(){let u=0,v=0;while(u===0)u=rnd();while(v===0)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
  const pts=[];
  for(let i=0;i<30;i++){pts.push({x:Math.min(58,Math.max(6,34+gauss()*11)),y:Math.min(70,Math.max(4,42+gauss()*13)),c:0});}
  for(let i=0;i<18;i++){pts.push({x:Math.min(30,Math.max(1,11+gauss()*6)),y:Math.min(45,Math.max(1,14+gauss()*8)),c:1});}
  let star={x:22,y:26};
  let K=5;
  const sx=v=>PL+v/60*plotW, sy=v=>PT+plotH-v/72*plotH;
  const NS='http://www.w3.org/2000/svg';
  function el(t,at){const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);return e;}
  function render(){
    svg.innerHTML='';
    svg.appendChild(el('line',{x1:PL,y1:PT+plotH,x2:PL+plotW,y2:PT+plotH,stroke:'#d8dbe2','stroke-width':1.5}));
    svg.appendChild(el('line',{x1:PL,y1:PT,x2:PL,y2:PT+plotH,stroke:'#d8dbe2','stroke-width':1.5}));
    const xl=el('text',{x:PL+plotW/2,y:H-8,'text-anchor':'middle',fill:'#888','font-size':'12','font-weight':'600'});
    xl.textContent='3 oyda faol kunlar';svg.appendChild(xl);
    const yl=el('text',{x:14,y:PT+plotH/2,fill:'#888','font-size':'12','font-weight':'600',transform:'rotate(-90 14 '+(PT+plotH/2)+')','text-anchor':'middle'});
    yl.textContent='tajriba, oy';svg.appendChild(yl);
    const ds=pts.map((p,i)=>({i,d:Math.hypot((p.x-star.x)/60,(p.y-star.y)/72)})).sort((a,b)=>a.d-b.d).slice(0,K);
    const nb=new Set(ds.map(o=>o.i));
    ds.forEach(o=>{
      const p=pts[o.i];
      svg.appendChild(el('line',{x1:sx(star.x),y1:sy(star.y),x2:sx(p.x),y2:sy(p.y),stroke:'#e0820a','stroke-width':1.6,class:'nline',opacity:.8}));
    });
    pts.forEach((p,i)=>{
      if(nb.has(i))svg.appendChild(el('circle',{cx:sx(p.x),cy:sy(p.y),r:11,fill:'none',stroke:'#e0820a','stroke-width':2,opacity:.85}));
      svg.appendChild(el('circle',{cx:sx(p.x),cy:sy(p.y),r:6.5,fill:p.c?'#e02d20':'#0064d6',opacity:.88}));
    });
    const g=el('g',{transform:'translate('+sx(star.x)+' '+sy(star.y)+')',cursor:'grab'});
    g.appendChild(el('circle',{r:12,fill:'#e0820a',stroke:'#fff','stroke-width':2.5}));
    const st=el('text',{'text-anchor':'middle',dy:4,fill:'#fff','font-size':'12','font-weight':'800'});st.textContent='?';
    g.appendChild(st);svg.appendChild(g);
    const churnVotes=ds.filter(o=>pts[o.i].c===1).length;
    const stay=K-churnVotes;
    const verdict=churnVotes>stay;
    const kv=document.getElementById('kv'),kd=document.getElementById('kd');
    kv.textContent=verdict?'ketadi':'qoladi';
    kv.style.color=verdict?'#e02d20':'#0064d6';
    kd.textContent='Qo\'shnilar ovozlari: '+churnVotes+' «ketadi», '+stay+' «qoladi», k = '+K+'.';
  }
  function toData(ev){
    const r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)*(W/r.width),py=(ev.clientY-r.top)*(H/r.height);
    return{x:Math.min(60,Math.max(0,(px-PL)/plotW*60)),y:Math.min(72,Math.max(0,(PT+plotH-py)/plotH*72))};
  }
  let drag=false;
  svg.addEventListener('pointerdown',ev=>{drag=true;svg.setPointerCapture(ev.pointerId);star=toData(ev);render();});
  svg.addEventListener('pointermove',ev=>{if(drag){star=toData(ev);render();}});
  svg.addEventListener('pointerup',()=>{drag=false;});
  document.querySelectorAll('.kbtn').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.kbtn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');K=parseInt(b.dataset.k);render();
    });
  });
  render();
})();
</script>

<!-- 07 TARGET 1: DEFINITION -->
<div class=&quot;slide&quot;>
<div class=&quot;sc&quot;>
  <p class=&quot;eyebrow&quot;>Building the target · 1 of 5</p>
  <h2>The target is not in the data. It is constructed</h2>
  <ul class=&quot;facts stag&quot;>
    <li>The bank's tables have no &quot;churned&quot; column. There are only transactions. <b>The target is the result of formalizing a business question</b>, and this work is done by an analyst before any machine learning.</li>
    <li>Our formalization: a client is considered churned if, after the reference date, they <b>made no successful transaction for two months</b>.</li>
    <li>The two-month horizon is a business decision. A shorter window would label clients on vacation as &quot;churned&quot;; a longer one means the retention team learns about the departure too late.</li>
    <li>A different formalization is a different task. &quot;Activity halved&quot; or &quot;closed the card&quot; give a different target, a different model, and a different call list.</li>
  </ul>
  <div class=&quot;note orange&quot; style=&quot;max-width:860px;&quot;><p>The quality of the target's formalization limits the quality of the whole system: no algorithm will fix an error introduced at this step.</p></div>
</div>
</div>


<!-- 08 TARGET 2: EXAMPLES -->
<div class=&quot;slide&quot;>
<div class=&quot;sc&quot;>
  <p class=&quot;eyebrow&quot;>Building the target · 2 of 5</p>
  <h2>Target = event + window + threshold</h2>
  <p class=&quot;sub&quot; style=&quot;margin-top:0;&quot;>The target is a column of zeros and ones that we add to the data ourselves: <b>1 - the event happened, 0 - it did not</b>. The only question is by what rule to set the one.</p>
  <div class=&quot;result&quot; style=&quot;max-width:1180px;margin-top:8px&quot;>
    <table>
      <thead><tr><th>Task</th><th class=&quot;wrap&quot;>What the target y means</th><th class=&quot;wrap&quot;>How we set 1 or 0</th></tr></thead>
      <tbody>
        <tr><td><b>Credit scoring</b></td><td class=&quot;wrap&quot;><span class=&quot;ng&quot;>1 - the borrower defaulted</span><br><span class=&quot;ok&quot;>0 - pays on time</span></td><td class=&quot;wrap&quot;>we look at the payment schedule <b>12 months</b> after issuance: the arrears reached <b>90+ days</b> - set 1. The 90 threshold is set by regulation, not the analyst</td></tr>
        <tr><td><b>Card churn</b> · our case</td><td class=&quot;wrap&quot;><span class=&quot;ng&quot;>1 - the client churned</span><br><span class=&quot;ok&quot;>0 - stayed active</span></td><td class=&quot;wrap&quot;>we look at the transaction log <b>60 days</b> after the reference date: no successful transaction - set 1. There is no &quot;churn&quot; event: the one comes from &quot;silence&quot;</td></tr>
        <tr><td><b>Anti-fraud</b></td><td class=&quot;wrap&quot;><span class=&quot;ng&quot;>1 - the transaction is fraudulent</span><br><span class=&quot;ok&quot;>0 - normal</span></td><td class=&quot;wrap&quot;>we look at the register of disputed transactions: the client disputed a transaction within <b>120 days</b> (chargeback) - set 1. Labels arrive with a delay</td></tr>
        <tr><td><b>Subscription cancellation</b> · streaming</td><td class=&quot;wrap&quot;><span class=&quot;ng&quot;>1 - the subscriber cancelled</span><br><span class=&quot;ok&quot;>0 - renewed</span></td><td class=&quot;wrap&quot;>we look at app events over <b>30 days</b>: there is a &quot;cancel&quot; tap - set 1. A rare case where the event is explicit and there is almost nothing to construct</td></tr>
        <tr><td><b>Resignation</b> · HR</td><td class=&quot;wrap&quot;><span class=&quot;ng&quot;>1 - the employee left</span><br><span class=&quot;ok&quot;>0 - still working</span></td><td class=&quot;wrap&quot;>we look at the HR system <b>6 months</b> after the reporting date: there is a termination order - set 1. The principle works in any industry</td></tr>
      </tbody>
    </table>
  </div>
  <div class=&quot;note orange rise&quot; style=&quot;max-width:1160px;animation-delay:1.1s;&quot;><p><b>The window must close.</b> A loan issued three months ago cannot be labeled by a 12-month window - the outcome is not yet known. That is why scoring models learn on borrowers from past years, and anti-fraud on transactions whose chargebacks have already arrived.</p></div>
</div>
</div>


<!-- TARGET TYPES -->
<div class=&quot;slide&quot;>
<div class=&quot;sc&quot;>
  <p class=&quot;eyebrow&quot;>Building the target · 3 of 5</p>
  <h2>The target need not be binary</h2>
  <div class=&quot;cards c3&quot; style=&quot;margin-top:12px&quot;>
    <div class=&quot;card acc-blue&quot;>
      <span class=&quot;badge&quot; style=&quot;background:#eef4fc;color:#0c447c&quot;>binary</span>
      <h4>Two classes</h4>
      <p>y ∈ {0, 1}: will churn or stay, will repay a loan or not. Our case today and the most common one in banking.</p>
    </div>
    <div class=&quot;card acc-purple&quot;>
      <span class=&quot;badge&quot; style=&quot;background:#f3efff;color:#4a1a8e&quot;>multiclass</span>
      <h4>Several classes</h4>
      <p>y is one of the categories: which product the client will take (deposit, credit card, nothing); the reason for a support request.</p>
    </div>
    <div class=&quot;card acc-green&quot;>
      <span class=&quot;badge&quot; style=&quot;background:#e8f5eb;color:#0d5a1e&quot;>regression</span>
      <h4>Number</h4>
      <p>y is a quantity: spending next month, the loss on a policy, days until equipment failure.</p>
    </div>
  </div>
  <ul class=&quot;facts stag&quot; style=&quot;margin-top:12px;&quot;>
    <li>One business task can be framed in different ways. Churn: <b>binary</b> &quot;will churn within 60 days&quot;, <b>regression</b> &quot;how many transactions in a quarter&quot;, or &quot;in how many days will they churn&quot;. Different targets - different models and different business actions.</li>
    <li>Even with a binary target, the model usually returns a <b>probability</b>: P(churn) = 0.73. Turning it into a &quot;call or not&quot; decision is a threshold choice, and that is a separate business decision. We will cover it in lesson 7.</li>
  </ul>

  <ul class=&quot;facts stag&quot; style=&quot;margin-top:10px;&quot;>
    <li>At prediction time the bank only knows the client's past. So during training the model must see only data <b>before the reference date</b>.</li>
    <li>The feature window is three months before the date: activity aggregates are computed over it. The target window is two months after: the outcome is determined over it.</li>
    <li>A feature computed from data after the reference date is a <b>leak</b> (data leakage): on history the model looks brilliant, in production it fails. A detailed walkthrough - lesson 12.</li>
  </ul>
</div>
</div>


<!-- 09 TARGET 3: SQL -->
<div class=&quot;slide&quot;>
<div class=&quot;sc&quot;>
  <p class=&quot;eyebrow&quot;>Building the target · 5 of 5</p>
  <h2>Assembling the dataset with SQL</h2>
  <div class=&quot;codebox&quot; style=&quot;max-width:940px;&quot;>
    <div class=&quot;codebar&quot;><span>churn_dataset.sql</span></div>
    <div class=&quot;code&quot; style=&quot;font-size:clamp(10px,.95vw,12.5px);line-height:1.6;&quot;><span class=&quot;cte&quot;><span class=&quot;kw&quot;>WITH</span> activity <span class=&quot;kw&quot;>AS</span> (   <span class=&quot;cm&quot;>-- features: three months before the reference date</span>
  <span class=&quot;kw&quot;>SELECT</span> ca.customer_id, <span class=&quot;fn&quot;>COUNT</span>(*) <span class=&quot;kw&quot;>AS</span> txn_count, <span class=&quot;fn&quot;>SUM</span>(t.amount_uzs) <span class=&quot;kw&quot;>AS</span> txn_sum,
         <span class=&quot;fn&quot;>COUNT</span>(<span class=&quot;kw&quot;>DISTINCT</span> t.txn_ts::date) <span class=&quot;kw&quot;>AS</span> n_active_days
  <span class=&quot;kw&quot;>FROM</span> ds_transactions_2 t <span class=&quot;kw&quot;>JOIN</span> ds_cards ca <span class=&quot;kw&quot;>USING</span> (card_id)
  <span class=&quot;kw&quot;>WHERE</span> t.txn_ts &amp;gt;= <span class=&quot;st&quot;>'2023-08-01'</span> <span class=&quot;kw&quot;>AND</span> t.txn_ts &amp;lt; <span class=&quot;st&quot;>'2023-10-30'</span>
  <span class=&quot;kw&quot;>GROUP BY</span> ca.customer_id),
future <span class=&quot;kw&quot;>AS</span> (       <span class=&quot;cm&quot;>-- transactions after the reference date</span>
  <span class=&quot;kw&quot;>SELECT DISTINCT</span> ca.customer_id
  <span class=&quot;kw&quot;>FROM</span> ds_transactions_2 t <span class=&quot;kw&quot;>JOIN</span> ds_cards ca <span class=&quot;kw&quot;>USING</span> (card_id)
  <span class=&quot;kw&quot;>WHERE</span> t.txn_ts &amp;gt;= <span class=&quot;st&quot;>'2023-10-30'</span>)</span>
<span class=&quot;kw&quot;>SELECT</span> a.*, <span class=&quot;sq&quot;><span class=&quot;kw&quot;>CASE WHEN</span> f.customer_id <span class=&quot;kw&quot;>IS NULL THEN</span> 1 <span class=&quot;kw&quot;>ELSE</span> 0 <span class=&quot;kw&quot;>END AS</span> churned</span>
<span class=&quot;kw&quot;>FROM</span> activity a <span class=&quot;kw&quot;>LEFT JOIN</span> future f <span class=&quot;kw&quot;>USING</span> (customer_id);</div>
  </div>
  <div class=&quot;note green&quot; style=&quot;max-width:940px;&quot;><p>The first CTE computes features over the window before the date, the second records activity after, <span class=&quot;mono&quot;>CASE WHEN</span> turns it into the target. These are the tools of block 2: assembling a dataset for ML is an ordinary SQL task. In today's practice you will assemble the lesson's dataset yourself - from the raw transaction log, using pandas and SQL.</p></div>
</div>
</div>

<!-- 10 FEATURES 1: SOURCES -->
<div class=&quot;slide&quot;>
<div class=&quot;sc&quot;>
  <p class=&quot;eyebrow&quot;>Features · 1 of 2</p>
  <h2>Where features come from</h2>
  <div class=&quot;cards c4&quot; style=&quot;margin-top:14px&quot;>
    <div class=&quot;card acc-blue&quot;><h4>Profile</h4><p>Age, region, segment, tenure. They change rarely, taken from the client record.</p></div>
    <div class=&quot;card acc-green&quot;><h4>Behavior</h4><p>Transaction aggregates over the window: transaction counts and sums, active days, number of merchants, e-com share. The most informative group.</p></div>
    <div class=&quot;card acc-purple&quot;><h4>Products</h4><p>Number and types of cards, limits, deposits, loans. A client with two products churns less often.</p></div>
    <div class=&quot;card acc-orange&quot;><h4>External sources</h4><p>Credit bureau, telecom operators, government registries. Data the bank does not have.</p></div>
  </div>
  <div class=&quot;note blue&quot; style=&quot;max-width:1180px;&quot;><p>Our dataset has three of the four groups: profile (age, months_active), products (n_cards), and behavior. The window aggregates - txn_count, txn_sum, n_active_days, n_merchants - are built with the same SQL from transactions; avg_check and share_ecom - the average check and e-com share over the entire service history - come from the card profile.</p></div>
</div>
</div>


<!-- 11 FEATURES 2: KATM -->
<div class=&quot;slide&quot;>
<div class=&quot;sc&quot;>
  <p class=&quot;eyebrow&quot;>Features · 2 of 2</p>
  <h2>External sources: the KATM credit bureau</h2>
  <ul class=&quot;facts stag&quot;>
    <li><b>KATM</b> (Kredit-axborot tahliliy markazi) is Uzbekistan's credit bureau: it stores the credit histories of borrowers from every bank in the country.</li>
    <li>When reviewing a loan application the bank requests a KATM report. The report's fields become features of the scoring model: <b>number of active loans, debt burden, arrears, recent applications to other banks</b>.</li>
    <li>The strength of external data is in what the bank cannot see itself: a client may be exemplary here and have five overdue loans at other banks.</li>
    <li>Credit scoring combines all four feature groups: profile, behavior, products, and the bureau report. We will cover this case in lesson 6.</li>
  </ul>
  <div class=&quot;note green&quot; style=&quot;max-width:860px;&quot;><p>In the churn task external sources are not used: behavioral features are enough. The feature set is always determined by the task.</p></div>
</div>
</div>

  <p class=&quot;sub&quot; style=&quot;margin-top:2px;&quot;>kNN, k nearest neighbors. One of the simplest classification methods; used here to demonstrate the general workflow.</p>
  <div class=&quot;cards c3&quot; style=&quot;margin-top:16px&quot;>
    <div class=&quot;card acc-blue&quot;>

      </svg>
      <h4>1. Distance</h4>
      <p>For a new client, the distance to every object in the training set is computed.</p>
    </div>
    <div class=&quot;card acc-purple&quot;>
      <svg class=&quot;mini&quot; viewBox=&quot;0 0 220 86&quot;>
        <circle cx=&quot;110&quot; cy=&quot;46&quot; r=&quot;8&quot; fill=&quot;#e0820a&quot;/>

        <circle cx=&quot;88&quot; cy=&quot;32&quot; r=&quot;6&quot; fill=&quot;#0064d6&quot; opacity=&quot;.85&quot;/><circle cx=&quot;132&quot; cy=&quot;30&quot; r=&quot;6&quot; fill=&quot;#e02d20&quot; opacity=&quot;.85&quot;/>
        <circle cx=&quot;94&quot; cy=&quot;62&quot; r=&quot;6&quot; fill=&quot;#e02d20&quot; opacity=&quot;.85&quot;/><circle cx=&quot;130&quot; cy=&quot;60&quot; r=&quot;6&quot; fill=&quot;#e02d20&quot; opacity=&quot;.85&quot;/>

        <circle cx=&quot;35&quot; cy=&quot;20&quot; r=&quot;6&quot; fill=&quot;#0064d6&quot; opacity=&quot;.45&quot;/><circle cx=&quot;190&quot; cy=&quot;70&quot; r=&quot;6&quot; fill=&quot;#0064d6&quot; opacity=&quot;.45&quot;/>

    </div>

  <svg width=&quot;940&quot; height=&quot;150&quot; viewBox=&quot;0 0 940 150&quot; style=&quot;max-width:100%;&quot;>

    <text x=&quot;378&quot; y=&quot;73&quot; text-anchor=&quot;middle&quot; font-size=&quot;12&quot; font-weight=&quot;600&quot; fill=&quot;#4a7a55&quot; font-family=&quot;Inter&quot;>the model learns on them: model.fit(X_train, y_train)</text>
    <rect class=&quot;growx g2&quot; x=&quot;744&quot; y=&quot;30&quot; width=&quot;176&quot; height=&quot;52&quot; rx=&quot;10&quot; fill=&quot;#fff3e6&quot; stroke=&quot;#f3d9ae&quot; stroke-width=&quot;1.5&quot;/>

    <text x=&quot;832&quot; y=&quot;112&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot; fill=&quot;#4a4d53&quot; font-family=&quot;Inter&quot;>exam questions:</text>
    <text x=&quot;832&quot; y=&quot;128&quot; text-anchor=&quot;middle&quot; font-size=&quot;12.5&quot; font-weight=&quot;600&quot; fill=&quot;#4a4d53&quot; font-family=&quot;Inter&quot;>the model sees them for the first time</text>

  <ul class=&quot;facts stag&quot; style=&quot;margin-top:10px;&quot;>
    <li>Quality is measured <b>only on test</b> - on clients the model did not see during training. Checking the model on train is like giving an exam on problems the student memorized with answers: the score comes out inflated and says nothing about performance on new clients.</li>

<!-- 15 CODE STEP 1 -->
<div class=&quot;slide&quot;>
<div class=&quot;sc&quot;>
  <p class=&quot;eyebrow&quot;>Practice · step 2 of 3</p>
  <h2>Splitting into training and test sets</h2>
  <div class=&quot;codebox&quot;>
    <div class=&quot;codebar&quot;><span>ml01_classwork.ipynb</span></div>
    <div class=&quot;code&quot;><span class=&quot;cl&quot; style=&quot;--i:0&quot;><span class=&quot;kw&quot;>import</span> pandas <span class=&quot;kw&quot;>as</span> pd</span><span class=&quot;cl&quot; style=&quot;--i:1&quot;><span class=&quot;kw&quot;>from</span> sklearn.model_selection <span class=&quot;kw&quot;>import</span> train_test_split</span><span class=&quot;cl&quot; style=&quot;--i:2&quot;> </span><span class=&quot;cl&quot; style=&quot;--i:3&quot;>df = pd.<span class=&quot;fn&quot;>read_csv</span>(<span class=&quot;st&quot;>'customers.csv'</span>)</span><span class=&quot;cl&quot; style=&quot;--i:4&quot;>X = df[[<span class=&quot;st&quot;>'age'</span>, <span class=&quot;st&quot;>'months_active'</span>, <span class=&quot;st&quot;>'n_cards'</span>, <span class=&quot;st&quot;>'txn_count'</span>, <span class=&quot;st&quot;>'txn_sum'</span>,</span><span class=&quot;cl&quot; style=&quot;--i:5&quot;>        <span class=&quot;st&quot;>'avg_check'</span>, <span class=&quot;st&quot;>'n_active_days'</span>, <span class=&quot;st&quot;>'n_merchants'</span>, <span class=&quot;st&quot;>'share_ecom'</span>]]</span><span class=&quot;cl&quot; style=&quot;--i:6&quot;>y = df[<span class=&quot;st&quot;>'churned'</span>]                <span class=&quot;cm&quot;># target</span></span><span class=&quot;cl&quot; style=&quot;--i:7&quot;> </span><span class=&quot;cl&quot; style=&quot;--i:8&quot;>X_train, X_test, y_train, y_test = <span class=&quot;sq&quot;><span class=&quot;fn&quot;>train_test_split</span>(X, y, test_size=<span class=&quot;nm&quot;>0.2</span>,</span></span><span class=&quot;cl&quot; style=&quot;--i:9&quot;><span class=&quot;sq&quot;>                                   stratify=y, random_state=<span class=&quot;nm&quot;>42</span>)</span></span></div>
  </div>
  <div class=&quot;cr&quot; style=&quot;margin-top:10px;&quot;>
    <div class=&quot;note green&quot;><p>Model quality is evaluated on data not used in training: the score on the training set is systematically inflated. Training - <b>1 120 clients</b>, validation - <b>280</b>.</p></div>
    <div class=&quot;note blue&quot;><p><span class=&quot;mono&quot;>stratify=y</span> keeps the 30% churn share in both parts. <span class=&quot;mono&quot;>random_state</span> fixes the split for reproducibility.</p></div>

  </div>

</div>
</div>

<!-- 18 BASELINE CONCEPT -->
<div class=&quot;slide&quot;>
<div class=&quot;sc&quot;>
  <p class=&quot;eyebrow&quot;>Evaluating the result · 2 of 4</p>
  <h2>The baseline model: a point of reference</h2>
  <ul class=&quot;facts stag&quot; style=&quot;margin-top:8px;&quot;>
    <li><b>The baseline model</b> is the simplest solution to the task, requiring no training. It answers the question: &quot;what do we get for free?&quot;</li>
    <li>For classification the standard baseline is to <b>always predict the most frequent class</b>. For regression - to predict the mean value.</li>
    <li>The baseline is built <b>before</b> complex models. Any model that does not beat it has no value regardless of how elegant the algorithm is.</li>
  </ul>
  <div class=&quot;codebox&quot; style=&quot;margin-top:12px;&quot;>
    <div class=&quot;codebar&quot;><span>ml01_classwork.ipynb</span></div>
    <div class=&quot;code&quot; style=&quot;font-size:clamp(10.5px,1vw,13.5px);&quot;><span class=&quot;cl&quot; style=&quot;--i:0&quot;><span class=&quot;kw&quot;>from</span> sklearn.dummy <span class=&quot;kw&quot;>import</span> DummyClassifier</span><span class=&quot;cl&quot; style=&quot;--i:1&quot;> </span><span class=&quot;cl&quot; style=&quot;--i:2&quot;>baseline = <span class=&quot;fn&quot;>DummyClassifier</span>(strategy=<span class=&quot;st&quot;>'most_frequent'</span>)   <span class=&quot;cm&quot;># always the most frequent class</span></span><span class=&quot;cl&quot; style=&quot;--i:3&quot;>baseline.<span class=&quot;ovin&quot;>fit</span>(X_train, y_train)</span><span class=&quot;cl&quot; style=&quot;--i:4&quot;><span class=&quot;fn&quot;>accuracy_score</span>(y_test, baseline.<span class=&quot;ovin&quot;>predict</span>(X_test))   <span class=&quot;resbadge&quot;>0.700</span></span></div>
  </div>
  <div class=&quot;note blue&quot; style=&quot;max-width:920px;&quot;><p><b>The baseline is not a separate metric, it is the same accuracy.</b> We compute the same share of correct answers with the same <span class=&quot;mono&quot;>accuracy_score</span> function - just for a primitive model. The baseline's 0.700 and our model's result are measured with the same ruler: we did not get a new scale, but a reference point on the old one.</p></div>
</div>
</div>

<!-- 19 TWO DUMMIES -->
<div class=&quot;slide&quot;>
<div class=&quot;sc&quot;>
  <p class=&quot;eyebrow&quot;>Evaluating the result · 3 of 4</p>
  <h2>The reference point is dictated by the data</h2>
  <p class=&quot;sub&quot; style=&quot;margin-top:0;&quot;>There are two trivial strategies: tell everyone &quot;stays&quot; or everyone &quot;churns&quot;. Let us compute both on 100 clients, of whom 70 stay.</p>
  <div class=&quot;bignum&quot;>
    <div class=&quot;bn rise&quot; style=&quot;animation-delay:.2s&quot;>
      <div class=&quot;v c-green&quot;><span data-cnt=&quot;0.700&quot; data-dec=&quot;3&quot;></span></div>
      <div class=&quot;t&quot;>everyone &quot;stays&quot;: hits 70 of 100</div>
    </div>
    <div class=&quot;bn rise&quot; style=&quot;animation-delay:.8s&quot;>
      <div class=&quot;v c-red&quot;><span data-cnt=&quot;0.300&quot; data-dec=&quot;3&quot;></span></div>
      <div class=&quot;t&quot;>everyone &quot;churns&quot;: hits 30 of 100</div>
    </div>
  </div>
  <ul class=&quot;facts stag&quot; style=&quot;margin-top:12px;&quot;>
    <li>The reference point is the <b>best</b> of the trivial strategies: if 0.700 is reachable with no model at all, comparing against 0.300 is unfair. That is why <span class=&quot;mono&quot;>DummyClassifier(strategy='most_frequent')</span> picks the most frequent class. Rule: <b>the accuracy baseline = the share of the most frequent class</b>.</li>
    <li>Reframing the task does not help: call the target &quot;churns&quot; instead of &quot;stays&quot; - the model's answers for each client are the same, the matches are the same, the accuracy is the same. The reference point is set by the proportion of classes in the data, not by how the question is worded.</li>
    <li>In a task where the churners are the majority, the best trivial strategy would be &quot;everyone churns&quot;. The baseline is always recomputed for the specific data.</li>
  </ul>

<!-- 22c SCALER CONCEPT -->
<div class=&quot;slide&quot;>
<div class=&quot;sc&quot;>
  <p class=&quot;eyebrow&quot;>Standardization · 1 of 5</p>
  <h2>StandardScaler: bringing to a common scale</h2>
  <p class=&quot;sub&quot; style=&quot;margin-top:0;&quot;>From each value the feature's mean is subtracted and the result is divided by the standard deviation. After this the feature has mean 0 and spread 1 - different features become comparable.</p>
  <div class=&quot;formula&quot; style=&quot;margin-top:14px;font-size:clamp(20px,2.6vw,34px);&quot;>
    <span class=&quot;fstep s1&quot;>x&amp;#8242; = (x - &amp;#956;) / &amp;#963;</span>
  </div>
  <p class=&quot;sub&quot; style=&quot;margin-top:8px;font-size:clamp(12px,1.3vw,15px);&quot;>&amp;#956; - the feature's mean over the training set,&amp;nbsp;&amp;nbsp;&amp;#963; - its standard deviation</p>
  <p class=&quot;lbl&quot; style=&quot;margin-top:clamp(12px,2vh,22px);&quot;>what else there is</p>
  <div class=&quot;cards c3&quot; style=&quot;margin-top:6px;&quot;>
    <div class=&quot;card acc-blue&quot;><h4>MinMaxScaler</h4><p>Squeezes values into the range [0, 1]: (x - min) / (max - min). Simple, but a single outlier stretches the whole scale.</p></div>
    <div class=&quot;card acc-green&quot;><h4>RobustScaler</h4><p>Instead of the mean and deviation it takes the median and the interquartile range. Robust to outliers.</p></div>
    <div class=&quot;card acc-purple&quot;><h4>MaxAbsScaler</h4><p>Divides by the maximum absolute value, keeping the sign and zeros. Used for sparse data.</p></div>
  </div>
  <div class=&quot;note blue&quot; style=&quot;max-width:1120px;&quot;><p>The choice depends on the data: with notable outliers use RobustScaler, for neural networks often MinMaxScaler. For kNN and linear models StandardScaler is a sensible starting point. We will look at it in detail on our example.</p></div>
</div>
</div>

        <text x=&quot;137&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#1a9d4a&quot; font-family=&quot;Inter&quot;>the bank has time to call</text>
        <text x=&quot;346&quot; y=&quot;90&quot; text-anchor=&quot;middle&quot; font-size=&quot;11.5&quot; font-weight=&quot;700&quot; fill=&quot;#c22317&quot; font-family=&quot;Inter&quot;>missed</text>
        <text x=&quot;8&quot; y=&quot;132&quot; font-size=&quot;18&quot; font-weight=&quot;800&quot; fill=&quot;#0b0c0e&quot; font-family=&quot;Inter&quot;>53 of 84 = 0.63</text>
      </svg>
    </div>
  </div>
  <div class=&quot;note orange&quot; style=&quot;max-width:880px;&quot;><p>Scaling did not just raise accuracy by a couple of points - it increased the number of churners caught from 12 to 53. The model's real value is visible in this count, not in accuracy.</p></div>
  <div class=&quot;note blue&quot; style=&quot;max-width:880px;&quot;><p>This count has a name and a formula - <b>recall</b>. Alongside lives a second metric - <b>precision</b>: of all whom the model flagged &quot;churn&quot;, how many actually churned. We will cover both in lesson 3; for now it is important to see that accuracy does not show them.</p></div>

<div class=&quot;sc&quot;>

  <h2>Two rulers for one model</h2>
  <p class=&quot;sub&quot; style=&quot;margin-top:0;&quot;>The same 280 test clients, 84 of them churn. We place both rulers side by side - accuracy and recall.</p>
  <div class=&quot;result&quot; style=&quot;max-width:900px;margin-top:8px&quot;>
    <table>
      <thead><tr><th>Model</th><th class=&quot;num&quot;>accuracy</th><th class=&quot;wrap&quot;>recall (caught of 84)</th></tr></thead>

        <tr><td><b>kNN without standardization</b></td><td class=&quot;num&quot;>0.650</td><td class=&quot;or&quot;><b>0.143</b> - 12 of 84</td></tr>
        <tr><td><b>kNN + standardization</b></td><td class=&quot;num&quot;>0.807</td><td class=&quot;ok&quot;><b>0.631</b> - 53 of 84</td></tr>

  <div class=&quot;note orange rise&quot; style=&quot;max-width:900px;animation-delay:.9s&quot;><p>Compare the dummy and kNN without standardization: by accuracy the dummy is higher (0.700 against 0.650), while by recall it is the opposite, kNN is higher (0.143 against 0.000). The two rulers give opposite conclusions. Accuracy mixes churners with stayers, and there are few churners - the main thing drowns in the overall mass. Standardization wins on both.</p></div>
  <div class=&quot;note blue rise&quot; style=&quot;max-width:900px;animation-delay:1.7s&quot;><p>That is why we lived with accuracy the whole lesson: it is the default metric, everyone starts with it, and its limit must be seen with your own eyes. Recall and precision, which answer the business question directly, are the topic of lesson 3. But first another debt: we took k = 5 at random. Lesson 2 - how to choose parameters honestly.</p></div>

<script>
const slides=document.querySelectorAll('.slide');

document.getElementById('tot').textContent=slides.length;
function runCounters(slide){
  slide.querySelectorAll('[data-cnt]').forEach(el=>{
    const target=parseFloat(el.dataset.cnt), dec=parseInt(el.dataset.dec||'0'), pre=el.dataset.pre||'', suf=el.dataset.suf||'';

      if(p<1)requestAnimationFrame(tick);

}
function go(n){

  cur=(n+slides.length)%slides.length;

  const sc=slides[cur].querySelector('.sc');

  slides[cur].querySelectorAll('.rise,.cl,.growx,.fl,.pstep,.pill,.resbadge,.mapnode,.mapline,.fstep').forEach(el=>{
    el.style.animation='none';void el.offsetWidth;el.style.animation='';
  });
  runCounters(slides[cur]);
  document.getElementById('cur').textContent=cur+1;
  document.getElementById('prog').style.width=((cur+1)/slides.length*100)+'%';
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1);}

<script>
/* kNN demo: draggable new client, adjustable k */
(function(){
  const svg=document.getElementById('knnsvg');
  if(!svg)return;
  const W=640,H=430,PL=54,PB=42,PT=14,PR=16;
  const plotW=W-PL-PR,plotH=H-PT-PB;
  function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
  const rnd=mulberry(7);
  function gauss(){let u=0,v=0;while(u===0)u=rnd();while(v===0)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
  const pts=[];
  for(let i=0;i<30;i++){pts.push({x:Math.min(58,Math.max(6,34+gauss()*11)),y:Math.min(70,Math.max(4,42+gauss()*13)),c:0});}
  for(let i=0;i<18;i++){pts.push({x:Math.min(30,Math.max(1,11+gauss()*6)),y:Math.min(45,Math.max(1,14+gauss()*8)),c:1});}
  let star={x:22,y:26};
  let K=5;
  const sx=v=>PL+v/60*plotW, sy=v=>PT+plotH-v/72*plotH;
  const NS='http://www.w3.org/2000/svg';
  function el(t,at){const e=document.createElementNS(NS,t);for(const k in at)e.setAttribute(k,at[k]);return e;}
  function render(){
    svg.innerHTML='';
    svg.appendChild(el('line',{x1:PL,y1:PT+plotH,x2:PL+plotW,y2:PT+plotH,stroke:'#d8dbe2','stroke-width':1.5}));
    svg.appendChild(el('line',{x1:PL,y1:PT,x2:PL,y2:PT+plotH,stroke:'#d8dbe2','stroke-width':1.5}));
    const xl=el('text',{x:PL+plotW/2,y:H-8,'text-anchor':'middle',fill:'#888','font-size':'12','font-weight':'600'});
    xl.textContent='active days over 3 months';svg.appendChild(xl);
    const yl=el('text',{x:14,y:PT+plotH/2,fill:'#888','font-size':'12','font-weight':'600',transform:'rotate(-90 14 '+(PT+plotH/2)+')','text-anchor':'middle'});
    yl.textContent='tenure, months';svg.appendChild(yl);
    const ds=pts.map((p,i)=>({i,d:Math.hypot((p.x-star.x)/60,(p.y-star.y)/72)})).sort((a,b)=>a.d-b.d).slice(0,K);
    const nb=new Set(ds.map(o=>o.i));
    ds.forEach(o=>{
      const p=pts[o.i];
      svg.appendChild(el('line',{x1:sx(star.x),y1:sy(star.y),x2:sx(p.x),y2:sy(p.y),stroke:'#e0820a','stroke-width':1.6,class:'nline',opacity:.8}));
    });
    pts.forEach((p,i)=>{
      if(nb.has(i))svg.appendChild(el('circle',{cx:sx(p.x),cy:sy(p.y),r:11,fill:'none',stroke:'#e0820a','stroke-width':2,opacity:.85}));
      svg.appendChild(el('circle',{cx:sx(p.x),cy:sy(p.y),r:6.5,fill:p.c?'#e02d20':'#0064d6',opacity:.88}));
    });
    const g=el('g',{transform:'translate('+sx(star.x)+' '+sy(star.y)+')',cursor:'grab'});
    g.appendChild(el('circle',{r:12,fill:'#e0820a',stroke:'#fff','stroke-width':2.5}));
    const st=el('text',{'text-anchor':'middle',dy:4,fill:'#fff','font-size':'12','font-weight':'800'});st.textContent='?';
    g.appendChild(st);svg.appendChild(g);
    const churnVotes=ds.filter(o=>pts[o.i].c===1).length;
    const stay=K-churnVotes;
    const verdict=churnVotes>stay;
    const kv=document.getElementById('kv'),kd=document.getElementById('kd');
    kv.textContent=verdict?'will churn':'will stay';
    kv.style.color=verdict?'#e02d20':'#0064d6';
    kd.textContent='Neighbor votes: '+churnVotes+' &quot;churn&quot;, '+stay+' &quot;stay&quot;, k = '+K+'.';
  }
  function toData(ev){
    const r=svg.getBoundingClientRect();
    const px=(ev.clientX-r.left)*(W/r.width),py=(ev.clientY-r.top)*(H/r.height);
    return{x:Math.min(60,Math.max(0,(px-PL)/plotW*60)),y:Math.min(72,Math.max(0,(PT+plotH-py)/plotH*72))};
  }
  let drag=false;
  svg.addEventListener('pointerdown',ev=>{drag=true;svg.setPointerCapture(ev.pointerId);star=toData(ev);render();});
  svg.addEventListener('pointermove',ev=>{if(drag){star=toData(ev);render();}});
  svg.addEventListener('pointerup',()=>{drag=false;});
  document.querySelectorAll('.kbtn').forEach(b=>{
    b.addEventListener('click',()=>{
      document.querySelectorAll('.kbtn').forEach(x=>x.classList.remove('on'));
      b.classList.add('on');K=parseInt(b.dataset.k);render();
    });
  });
  render();
})();
</script>
